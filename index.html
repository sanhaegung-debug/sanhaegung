<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산해궁 - SOOP 스트리머 구단 정보</title>
    <!-- 파이어베이스 SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff0055;
        }
        header h1 {
            margin: 0;
            color: #ff0055;
            font-size: 28px;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-toggle-btn {
            background-color: #333;
            color: #aaa;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .admin-toggle-btn:hover {
            background-color: #ff0055;
            color: white;
            border-color: #ff0055;
        }
        /* 관리자 패널 */
        .admin-panel {
            background-color: #1a1a1a;
            border: 1px dashed #ff0055;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: none;
        }
        .admin-panel h3 {
            margin-top: 0;
            color: #ff0055;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #ccc;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #e0004c;
        }
        /* 스트리머 카드 Grid */
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .streamer-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            position: relative;
        }
        .streamer-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }
        .streamer-owner {
            font-size: 13px;
            color: #ff0055;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .info-row {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 6px;
        }
        .info-row span {
            color: #fff;
            font-weight: bold;
        }
        .soop-btn {
            display: block;
            text-align: center;
            background-color: #333;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            margin-top: 15px;
        }
        .soop-btn:hover {
            background-color: #ff0055;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-size: 14px;
        }
        .delete-btn:hover {
            color: #ff0055;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏛️ 산해궁 (SANHAEGUNG)</h1>
        <p>SOOP 스트리머 구단 정보 아카이브</p>
    </header>

    <div class="container">
        <h2>
            <span>🔴 SOOP 스트리머 구단 정보</span>
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">관리자 모드 열기/닫기</button>
        </h2>

        <!-- 관리자 등록 폼 -->
        <div id="adminPanel" class="admin-panel">
            <h3>🛠️ 스트리머 정보 등록</h3>
            <div class="form-group">
                <label>스트리머 이름</label>
                <input type="text" id="streamerName" placeholder="예: 감스트">
            </div>
            <div class="form-group">
                <label>구단주명 (FC 온라인 닉네임)</label>
                <input type="text" id="ownerName" placeholder="예: 감스트오리지널">
            </div>
            <div class="form-group">
                <label>구단 가치</label>
                <input type="text" id="clubValue" placeholder="예: 500조 300억">
            </div>
            <div class="form-group">
                <label>포메이션</label>
                <input type="text" id="formation" placeholder="예: 4-2-3-1">
            </div>
            <div class="form-group">
                <label>팀컬러</label>
                <input type="text" id="teamColor" placeholder="예: 맨체스터 유나이티드 / 대한민국">
            </div>
            <div class="form-group">
                <label>SOOP 방송국 링크 (URL)</label>
                <input type="text" id="soopUrl" placeholder="예: https://www.sooplive.co.kr/...">
            </div>
            <button class="submit-btn" onclick="addStreamer()">등록하기</button>
        </div>

        <!-- 스트리머 목록이 출력되는 공간 -->
        <div id="streamerGrid" class="streamer-grid">
            <p style="color: #777;">데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <script>
        // 파이어베이스 프로젝트 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForSanhaegung...",
            authDomain: "sanhaegung-dea90.firebaseapp.com",
            projectId: "sanhaegung-dea90",
            storageBucket: "sanhaegung-dea90.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:123456:web:abcd"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 관리자 패널 토글 함수
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // 스트리머 등록 함수
        function addStreamer() {
            const name = document.getElementById('streamerName').value.trim();
            const owner = document.getElementById('ownerName').value.trim();
            const value = document.getElementById('clubValue').value.trim();
            const formation = document.getElementById('formation').value.trim();
            const color = document.getElementById('teamColor').value.trim();
            const url = document.getElementById('soopUrl').value.trim();

            if (!name || !owner) {
                alert('스트리머 이름과 구단주명은 필수 입력 항목입니다!');
                return;
            }

            db.collection("streamers").add({
                name: name,
                owner: owner,
                value: value || '정보 없음',
                formation: formation || '정보 없음',
                color: color || '정보 없음',
                url: url || 'https://www.sooplive.co.kr/',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('성공적으로 등록되었습니다!');
                // 입력창 초기화
                document.getElementById('streamerName').value = '';
                document.getElementById('ownerName').value = '';
                document.getElementById('clubValue').value = '';
                document.getElementById('formation').value = '';
                document.getElementById('teamColor').value = '';
                document.getElementById('soopUrl').value = '';
                toggleAdminPanel();
            }).catch((error) => {
                alert('등록 중 오류가 발생했습니다: ' + error.message);
            });
        }

        // 스트리머 삭제 함수
        function deleteStreamer(id) {
            if (confirm('정말 이 스트리머 정보를 삭제하시겠습니까?')) {
                db.collection("streamers").doc(id).delete().then(() => {
                    alert('삭제되었습니다.');
                }).catch((error) => {
                    alert('삭제 실패: ' + error.message);
                });
            }
        }

        // 실시간으로 데이터 불러오기 (Firestore)
        db.collection("streamers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const grid = document.getElementById('streamerGrid');
            grid.innerHTML = '';

            if (snapshot.empty) {
                grid.innerHTML = '<p style="color: #777;">등록된 스트리머 정보가 없습니다. 관리자 모드를 열어 추가해 보세요!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;

                const card = document.createElement('div');
                card.className = 'streamer-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteStreamer('${id}')" title="삭제">✕</button>
                    <div class="streamer-name">${data.name}</div>
                    <div class="streamer-owner">구단주: ${data.owner}</div>
                    <div class="info-row">구단가치: <span>${data.value}</span></div>
                    <div class="info-row">포메이션: <span>${data.formation}</span></div>
                    <div class="info-row">팀컬러: <span>${data.color}</span></div>
                    <a href="${data.url}" target="_blank" class="soop-btn">SOOP 방송국 바로가기</a>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
