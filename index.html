<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아르케온 기숙사 - 마법해금 & 연금술 연구소</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181c24;
      --accent-color: #8a2be2;
      --accent-hover: #9c3eee;
      --text-color: #e2e8f0;
      --border-color: #2d3748;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .header h1 {
      color: var(--accent-color);
      margin: 0 0 5px 0;
      font-size: 26px;
    }

    .user-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 0.85em;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-menu {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filter-search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .element-sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 5px;
      flex: 1;
    }

    .element-sub-btn, .status-sub-btn {
      background-color: #181818;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .element-sub-btn.active, .status-sub-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .search-input-box {
      min-width: 240px;
      flex: 0.5;
    }

    .search-input-box input {
      margin-bottom: 0;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* 진척도 패널 */
    .progress-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.9em;
    }
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .progress-item {
      background: rgba(15, 17, 21, 0.5);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #0f1115;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
    }

    button:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #4a5568; color: #fff; }
    .btn-danger { background-color: #e53e3e; color: #fff; }

    .action-bar {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .magic-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
    }
    .magic-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }
    .magic-card.completed {
      border-color: #319795;
      background-color: rgba(49, 151, 149, 0.05);
    }

    .magic-img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 8px;
      margin: 12px 0;
      background-color: #0f1115;
      cursor: pointer;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      width: fit-content;
    }
    .badge-바람 { background-color: #319795; color: #fff; }
    .badge-화염 { background-color: #dd6b20; color: #fff; }
    .badge-물 { background-color: #3182ce; color: #fff; }
    .badge-대지 { background-color: #276749; color: #fff; }
    .badge-빛 { background-color: #d69e2e; color: #000; }
    .badge-어둠 { background-color: #4a5568; color: #fff; }

    .info-box {
      background-color: rgba(15, 17, 21, 0.6);
      border-radius: 6px;
      padding: 10px;
      margin-top: auto;
      font-size: 13px;
    }

    .info-row {
      margin-bottom: 4px;
      color: #cbd5e0;
      display: flex;
      justify-content: space-between;
    }
    .info-row span {
      color: #fff;
      font-weight: bold;
      text-align: right;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--border-color);
    }

    #imageModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }

    #expandedImg {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 8px;
    }

    .card-action-btns {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
    }

    .card-action-btns button {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      color: #cbd5e0;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .card-action-btns button:hover { background-color: var(--accent-color); color: #fff; }

    .checkbox-container {
      margin-top: 12px;
      background: rgba(138, 43, 226, 0.1);
      border: 1px dashed var(--accent-color);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .inline-edit-box {
      background: #11141a;
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>

  <!-- Firebase SDK 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCL-9nkL26H-ZQufDznXERNlf_eDeHmwjs",
      authDomain: "sanhaegung-dea90.firebaseapp.com",
      projectId: "sanhaegung-dea90",
      storageBucket: "sanhaegung-dea90.firebasestorage.app",
      messagingSenderId: "876388941028",
      appId: "1:876388941028:web:51b83acd86fb1ef709c0f1",
      measurementId: "G-9B699532TC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>✨ 아르케온 기숙사 마법해금 & 연금술 연구소</h1>
      <p style="font-size: 0.9em; margin: 5px 0 0 0; color: #a0aec0;">SOOP 마인크래프트 서버 '차카데미' 아르케온 기숙사 전용 공유소</p>
    </div>

    <div class="user-bar">
      <span id="userInfoDisplay" style="align-self: center; margin-right: auto; color: var(--accent-color);">✨ 접속 중...</span>
      <button onclick="openLoginModal()" class="btn-secondary">👤 사용자 변경</button>
      <button onclick="tryOpenRegisterForm('magic')" id="registerBtn">+ 새 마법 등록</button>
    </div>

    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('magic', event)">🔮 마법해금 조건 공유</button>
      <button class="tab-btn" onclick="switchTab('alchemy', event)">🧪 연금술 레시피</button>
      <button class="tab-btn" onclick="switchTab('notice', event)">📢 공지사항</button>
    </div>

    <!-- 1. 마법해금 조건 공유 탭 -->
    <div id="tab-magic" class="tab-content active">
      
      <!-- 내 진척도 패널 -->
      <div id="progressPanel" class="progress-panel">
        <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 5px;" id="progressTitle">📊 내 마법 해금 진척도</div>
        <div class="progress-grid" id="progressGrid"></div>
      </div>

      <!-- 속성별 서브 탭 -->
      <div class="filter-search-bar">
        <div class="element-sub-tabs">
          <button class="element-sub-btn active" onclick="setElementFilter('all', this)">🌪️ 전체 속성</button>
          <button class="element-sub-btn" onclick="setElementFilter('바람', this)">💨 바람</button>
          <button class="element-sub-btn" onclick="setElementFilter('화염', this)">🔥 화염</button>
          <button class="element-sub-btn" onclick="setElementFilter('물', this)">💧 물</button>
          <button class="element-sub-btn" onclick="setElementFilter('대지', this)">🌍 대지</button>
          <button class="element-sub-btn" onclick="setElementFilter('빛', this)">✨ 빛</button>
          <button class="element-sub-btn" onclick="setElementFilter('어둠', this)">🌑 어둠</button>
        </div>
      </div>

      <!-- 직관적인 상태별 보기 버튼 & 검색 바 -->
      <div class="filter-search-bar">
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button class="status-sub-btn active" onclick="setStatusFilter('all', this)">📌 전체 보기</button>
          <button class="status-sub-btn" onclick="setStatusFilter('completed', this)">✅ 해금된 마법</button>
          <button class="status-sub-btn" onclick="setStatusFilter('uncompleted', this)">❌ 미해금 마법</button>
        </div>
        
        <div class="search-input-box">
          <input type="text" id="magicSearchInput" placeholder="🔍 마법 이름, 스트리머, 재료 검색..." oninput="renderMagics()">
        </div>
      </div>

      <!-- 새 마법 등록 폼 -->
      <div id="form-magic-card" class="card" style="display:none;">
        <h4 style="color:var(--accent-color); margin-top:0;">새 마법해금 정보 등록</h4>
        <input type="text" id="magTitle" placeholder="마법 이름 (예: 파이어볼 2단계)">
        <input type="text" id="magAuthor" placeholder="스트리머 닉네임" readonly style="background:#1a1d26; color:#a0aec0;">
        <select id="magElement">
          <option value="바람">💨 바람 속성</option>
          <option value="화염">🔥 화염 속성</option>
          <option value="물">💧 물 속성</option>
          <option value="대지">🌍 대지 속성</option>
          <option value="빛">✨ 빛 속성</option>
          <option value="어둠">🌑 어둠 속성</option>
        </select>
        <input type="text" id="magMaterials" placeholder="필요 재료 (예: 마력 결정 5개)">
        <input type="text" id="magLocation" placeholder="해금 조건 (예: 네더 요새에서 몬스터 50마리 처치)">
        <textarea id="magDesc" rows="3" placeholder="상세 공략 및 주의사항 (선택사항)"></textarea>
        <input type="text" id="magImgUrl" placeholder="인증 이미지 URL 링크 (선택사항)">

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveNewMagic()">등록하기</button>
          <button class="btn-secondary" onclick="closeMagicRegisterForm()">취소</button>
        </div>
      </div>

      <div id="magicGrid" class="grid-container"></div>
    </div>

    <!-- 2. 연금술 레시피 탭 -->
    <div id="tab-alchemy" class="tab-content">
      <div class="action-bar">
        <h3>🧪 연금술 조합법 공유</h3>
        <button onclick="tryOpenRegisterForm('alchemy')" id="alchemyRegisterBtn">+ 새 연금술 레시피 등록</button>
      </div>

      <!-- 새 연금술 등록 폼 -->
      <div id="form-alchemy-card" class="card" style="display:none;">
        <h4 style="color:var(--accent-color); margin-top:0;">새 연금술 레시피 등록</h4>
        <input type="text" id="alcTitle" placeholder="조합 결과물 이름 (예: 고급 마력 포션)">
        <input type="text" id="alcAuthor" placeholder="스트리머 닉네임" readonly style="background:#1a1d26; color:#a0aec0;">
        <input type="text" id="alcIngredients" placeholder="조합 재료 (예: 마력 가루 2개 + 공허의 물 1병)">
        <input type="text" id="alcLocation" placeholder="조합 도구 / 장소 (예: 연금술 가솥, 기숙사 지하 실험실)">
        <textarea id="alcDesc" rows="3" placeholder="제조 팁 및 효과 설명 (선택사항)"></textarea>
        <input type="text" id="alcImgUrl" placeholder="이미지 URL 링크 (선택사항)">

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveNewAlchemy()">등록하기</button>
          <button class="btn-secondary" onclick="closeAlchemyRegisterForm()">취소</button>
        </div>
      </div>

      <div id="alchemyGrid" class="grid-container"></div>
    </div>

    <!-- 3. 공지사항 탭 -->
    <div id="tab-notice" class="tab-content">
      <div class="action-bar">
        <h3>기숙사 공지사항</h3>
      </div>
      <div id="noticeList"></div>
    </div>
  </div>

  <!-- 이미지 확대 모달 -->
  <div id="imageModal" onclick="closeImageModal()">
    <img id="expandedImg" src="">
  </div>

  <!-- 첫 접속 시 강제 로그인 모달 (배경 클릭으로 닫히지 않음) -->
  <div id="loginModal" class="modal" style="display:flex;">
    <div class="modal-content" style="max-width: 500px;">
      <h3 style="margin-top:0; color:var(--accent-color);">✨ 아르케온 기숙사 입장</h3>
      <p style="font-size:0.85em; color:#a0aec0;">본인의 닉네임을 선택하고 공통 비밀번호를 입력해주세요.</p>
      
      <label style="font-size:0.85em; color:#cbd5e0; display:block; margin-bottom:5px;">스트리머 선택:</label>
      <select id="streamerSelect" style="margin-bottom:12px;">
        <option value="">-- 본인 닉네임을 선택하세요 --</option>
      </select>

      <label style="font-size:0.85em; color:#cbd5e0; display:block; margin-bottom:5px;">공통 비밀번호:</label>
      <input type="password" id="checkSecretPw" placeholder="비밀번호 입력">

      <button onclick="verifyStreamerLogin()" style="width:100%; margin-top:5px; padding:10px;">입장하기</button>
    </div>
  </div>

  <script>
    const STREAMER_PASSWORD = "rinring"; 

    const STREAMERS = [
      "강만식", "띵굴", "사과몽", "쥐돌이", "킴성태", "오아", "린링", "푸닝", "구월이", "딸기슈몽이", "연우얌",
      "임구산", "유즈코", "미링", "한아련", "슈아", "김성진", "현단아", "제복이", "잼율이", "해또잉",
      "김나오", "복새달", "잠결", "고채린", "첼시냥", "김쁘피", "꾱아지", "꿈틀", "상득", "린코", "류새콤", "윤이결",
      "밍가연", "카푸", "엘리스얌", "모바샤", "망개", "나몽", "롯시", "스위데", "콘치", "요한.3.", "시몽", "김뱅글",
      "지한이또", "김멘탈", "한예림", "냥애웅", "쁘이_v", "개리"
    ];

    let store = {
      magics: [],
      alchemys: [],
      notices: [],
      myCompletions: {} 
    };

    let currentElementFilter = 'all';
    let currentStatusFilter = 'all';
    let currentStreamer = null;
    let editingMagicId = null;
    let editingAlchemyId = null;

    window.addEventListener('firebase-ready', async () => {
      initStreamerSelect();
      loadSession();
    });

    function initStreamerSelect() {
      const select = document.getElementById('streamerSelect');
      STREAMERS.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        select.appendChild(opt);
      });
    }

    async function loadSession() {
      const saved = sessionStorage.getItem('archeon_streamer');
      if (saved) {
        currentStreamer = saved;
        document.getElementById('loginModal').style.display = 'none';
        updateAuthDisplay();
        await loadAllData();
        renderAll();
      } else {
        // 로그인 안 되어 있으면 로그인 모달 유지
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function updateAuthDisplay() {
      const display = document.getElementById('userInfoDisplay');
      if (currentStreamer) {
        display.innerHTML = `✨ <b>${currentStreamer}</b>님 접속 중`;
      }
    }

    async function loadAllData() {
      try {
        const mSnap = await getDocs(collection(window.db, "archeon_magics"));
        store.magics = mSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        const aSnap = await getDocs(collection(window.db, "archeon_alchemys"));
        store.alchemys = aSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        const nSnap = await getDocs(collection(window.db, "archeon_notices"));
        store.notices = nSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        if (currentStreamer) {
          await loadMyCompletions();
        }
      } catch (e) {
        console.error("데이터 로딩 실패:", e);
      }
    }

    async function loadMyCompletions() {
      if(!currentStreamer) return;
      try {
        const docRef = doc(window.db, "archeon_user_progress", currentStreamer);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          store.myCompletions = docSnap.data().completions || {};
        } else {
          store.myCompletions = {};
        }
      } catch(e) {
        console.error("진척도 로딩 실패:", e);
      }
    }

    function openLoginModal() {
      document.getElementById('checkSecretPw').value = '';
      if(currentStreamer) {
        document.getElementById('streamerSelect').value = currentStreamer;
      }
      document.getElementById('loginModal').style.display = 'flex';
    }

    async function verifyStreamerLogin() {
      const selected = document.getElementById('streamerSelect').value;
      const pwInput = document.getElementById('checkSecretPw').value.trim();

      if(!selected) {
        alert("본인의 스트리머 닉네임을 선택해주세요.");
        return;
      }
      if (pwInput !== STREAMER_PASSWORD) {
        alert("공통 비밀번호가 틀렸습니다.");
        return;
      }

      currentStreamer = selected;
      sessionStorage.setItem('archeon_streamer', currentStreamer);
      document.getElementById('loginModal').style.display = 'none';
      updateAuthDisplay();
      
      await loadAllData();
      renderAll();
      alert(`${currentStreamer}님 환영합니다!`);
    }

    function switchTab(tabName, event) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      if(event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }
    }

    function setElementFilter(element, btnEl) {
      currentElementFilter = element;
      document.querySelectorAll('.element-sub-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderMagics();
    }

    function setStatusFilter(status, btnEl) {
      currentStatusFilter = status;
      document.querySelectorAll('.status-sub-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderMagics();
    }

    function openImageModal(imgSrc, event) {
      if(event) event.stopPropagation();
      document.getElementById('expandedImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() { document.getElementById('imageModal').style.display = 'none'; }

    // --- 마법 등록 및 인라인 수정 함수 ---
    function tryOpenRegisterForm(type) {
      if(type === 'magic') {
        document.getElementById('form-magic-card').style.display = 'block';
        document.getElementById('magAuthor').value = currentStreamer;
      } else if(type === 'alchemy') {
        document.getElementById('form-alchemy-card').style.display = 'block';
        document.getElementById('alcAuthor').value = currentStreamer;
      }
    }

    function closeMagicRegisterForm() { document.getElementById('form-magic-card').style.display = 'none'; }
    function closeAlchemyRegisterForm() { document.getElementById('form-alchemy-card').style.display = 'none'; }

    async function saveNewMagic() {
      const title = document.getElementById('magTitle').value.trim();
      const author = currentStreamer;
      const element = document.getElementById('magElement').value;
      const materials = document.getElementById('magMaterials').value.trim();
      const location = document.getElementById('magLocation').value.trim();
      const description = document.getElementById('magDesc').value.trim();
      const imageUrl = document.getElementById('magImgUrl').value.trim();

      if(!title) { alert("마법 이름은 필수입니다."); return; }

      const newMagic = {
        id: Date.now(),
        title, author, element, materials, location, description,
        image: imageUrl,
        date: new Date().toLocaleDateString()
      };
      const docRef = await addDoc(collection(window.db, "archeon_magics"), newMagic);
      store.magics.unshift({ firestoreId: docRef.id, ...newMagic });

      document.getElementById('magTitle').value = '';
      document.getElementById('magMaterials').value = '';
      document.getElementById('magLocation').value = '';
      document.getElementById('magDesc').value = '';
      document.getElementById('magImgUrl').value = '';
      closeMagicRegisterForm();
      renderMagics();
      alert("성공적으로 등록되었습니다!");
    }

    function startInlineEditMagic(firestoreId) {
      editingMagicId = firestoreId;
      renderMagics();
    }

    function cancelInlineEditMagic() {
      editingMagicId = null;
      renderMagics();
    }

    async function saveInlineEditMagic(firestoreId) {
      const title = document.getElementById(`edit_m_title_${firestoreId}`).value.trim();
      const element = document.getElementById(`edit_m_element_${firestoreId}`).value;
      const materials = document.getElementById(`edit_m_materials_${firestoreId}`).value.trim();
      const location = document.getElementById(`edit_m_location_${firestoreId}`).value.trim();
      const description = document.getElementById(`edit_m_desc_${firestoreId}`).value.trim();
      const image = document.getElementById(`edit_m_img_${firestoreId}`).value.trim();

      if(!title) { alert("마법 이름은 필수입니다."); return; }

      const target = store.magics.find(m => m.firestoreId === firestoreId);
      if(target) {
        target.title = title;
        target.author = currentStreamer;
        target.element = element;
        target.materials = materials;
        target.location = location;
        target.description = description;
        target.image = image;
        target.date = new Date().toLocaleDateString();

        await updateDoc(doc(window.db, "archeon_magics", firestoreId), {
          title, author: currentStreamer, element, materials, location, description, image
        });
      }

      editingMagicId = null;
      renderMagics();
      alert("수정 완료되었습니다!");
    }

    async function deleteMagic(firestoreId) {
      if(!confirm("정말 이 해금 정보를 삭제하시겠습니까?")) return;
      await deleteDoc(doc(window.db, "archeon_magics", firestoreId));
      store.magics = store.magics.filter(m => m.firestoreId !== firestoreId);
      renderMagics();
      alert("삭제되었습니다.");
    }

    // --- 연금술 등록 및 인라인 수정 함수 ---
    async function saveNewAlchemy() {
      const title = document.getElementById('alcTitle').value.trim();
      const author = currentStreamer;
      const ingredients = document.getElementById('alcIngredients').value.trim();
      const location = document.getElementById('alcLocation').value.trim();
      const description = document.getElementById('alcDesc').value.trim();
      const imageUrl = document.getElementById('alcImgUrl').value.trim();

      if(!title) { alert("조합 결과물 이름은 필수입니다."); return; }

      const newAlchemy = {
        id: Date.now(),
        title, author, ingredients, location, description,
        image: imageUrl,
        date: new Date().toLocaleDateString()
      };
      const docRef = await addDoc(collection(window.db, "archeon_alchemys"), newAlchemy);
      store.alchemys.unshift({ firestoreId: docRef.id, ...newAlchemy });

      document.getElementById('alcTitle').value = '';
      document.getElementById('alcIngredients').value = '';
      document.getElementById('alcLocation').value = '';
      document.getElementById('alcDesc').value = '';
      document.getElementById('alcImgUrl').value = '';
      closeAlchemyRegisterForm();
      renderAlchemys();
      alert("성공적으로 등록되었습니다!");
    }

    function startInlineEditAlchemy(firestoreId) {
      editingAlchemyId = firestoreId;
      renderAlchemys();
    }

    function cancelInlineEditAlchemy() {
      editingAlchemyId = null;
      renderAlchemys();
    }

    async function saveInlineEditAlchemy(firestoreId) {
      const title = document.getElementById(`edit_a_title_${firestoreId}`).value.trim();
      const ingredients = document.getElementById(`edit_a_ingredients_${firestoreId}`).value.trim();
      const location = document.getElementById(`edit_a_location_${firestoreId}`).value.trim();
      const description = document.getElementById(`edit_a_desc_${firestoreId}`).value.trim();
      const image = document.getElementById(`edit_a_img_${firestoreId}`).value.trim();

      if(!title) { alert("조합 결과물 이름은 필수입니다."); return; }

      const target = store.alchemys.find(a => a.firestoreId === firestoreId);
      if(target) {
        target.title = title;
        target.author = currentStreamer;
        target.ingredients = ingredients;
        target.location = location;
        target.description = description;
        target.image = image;
        target.date = new Date().toLocaleDateString();

        await updateDoc(doc(window.db, "archeon_alchemys", firestoreId), {
          title, author: currentStreamer, ingredients, location, description, image
        });
      }

      editingAlchemyId = null;
      renderAlchemys();
      alert("수정 완료되었습니다!");
    }

    async function deleteAlchemy(firestoreId) {
      if(!confirm("정말 이 연금술 레시피를 삭제하시겠습니까?")) return;
      await deleteDoc(doc(window.db, "archeon_alchemys", firestoreId));
      store.alchemys = store.alchemys.filter(a => a.firestoreId !== firestoreId);
      renderAlchemys();
      alert("삭제되었습니다.");
    }

    // 개인 해금 상태 토글
    async function toggleCompletion(firestoreId, event) {
      if(event) event.stopPropagation();

      const isCompleted = !!store.myCompletions[firestoreId];
      if(isCompleted) {
        delete store.myCompletions[firestoreId];
      } else {
        store.myCompletions[firestoreId] = true;
      }

      try {
        const docRef = doc(window.db, "archeon_user_progress", currentStreamer);
        await setDoc(docRef, { completions: store.myCompletions }, { merge: true });
      } catch (e) {
        console.error("진척도 저장 실패:", e);
      }

      renderAll();
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function renderAll() {
      renderProgressPanel();
      renderMagics();
      renderAlchemys();
      renderNotices();
    }

    function renderProgressPanel() {
      const grid = document.getElementById('progressGrid');
      document.getElementById('progressTitle').innerText = `📊 ${currentStreamer}님의 속성별 마법 해금 진척도`;
      grid.innerHTML = '';

      const elements = ['바람', '화염', '물', '대지', '빛', '어둠'];
      elements.forEach(el => {
        const total = store.magics.filter(m => m.element === el).length;
        const completed = store.magics.filter(m => m.element === el && store.myCompletions[m.firestoreId]).length;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

        grid.innerHTML += `
          <div class="progress-item">
            <div style="font-size: 12px; color: #a0aec0; margin-bottom: 2px;">${el}</div>
            <div style="font-weight: bold; font-size: 15px; color: #fff;">${completed} / ${total} <span style="font-size:11px; color:var(--accent-color);">(${percent}%)</span></div>
          </div>
        `;
      });
    }

    function renderMagics() {
      const grid = document.getElementById('magicGrid');
      const searchKeyword = document.getElementById('magicSearchInput') ? document.getElementById('magicSearchInput').value.toLowerCase().trim() : '';
      grid.innerHTML = '';

      let filtered = store.magics.filter(m => {
        const matchElement = (currentElementFilter === 'all' || m.element === currentElementFilter);
        const matchSearch = (!searchKeyword || 
          (m.title && m.title.toLowerCase().includes(searchKeyword)) || 
          (m.author && m.author.toLowerCase().includes(searchKeyword)) || 
          (m.materials && m.materials.toLowerCase().includes(searchKeyword)) ||
          (m.location && m.location.toLowerCase().includes(searchKeyword))
        );
        
        const isCompleted = !!store.myCompletions[m.firestoreId];
        let matchStatus = true;
        if(currentStatusFilter === 'completed') matchStatus = isCompleted;
        if(currentStatusFilter === 'uncompleted') matchStatus = !isCompleted;

        return matchElement && matchSearch && matchStatus;
      });

      if(filtered.length === 0) {
        grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; text-align:center;">조건에 일치하는 마법 해금 조건이 없습니다.</p>`;
        return;
      }

      filtered.forEach(m => {
        const elType = m.element || '바람';
        const isCompleted = !!store.myCompletions[m.firestoreId];
        const isEditing = (editingMagicId === m.firestoreId);

        if (isEditing) {
          grid.innerHTML += `
            <div class="magic-card">
              <span class="badge badge-${elType}">수정 모드</span>
              <div class="inline-edit-box">
                <input type="text" id="edit_m_title_${m.firestoreId}" value="${escapeHtml(m.title)}" placeholder="마법 이름">
                <select id="edit_m_element_${m.firestoreId}">
                  <option value="바람" ${elType==='바람'?'selected':''}>💨 바람 속성</option>
                  <option value="화염" ${elType==='화염'?'selected':''}>🔥 화염 속성</option>
                  <option value="물" ${elType==='물'?'selected':''}>💧 물 속성</option>
                  <option value="대지" ${elType==='대지'?'selected':''}>🌍 대지 속성</option>
                  <option value="빛" ${elType==='빛'?'selected':''}>✨ 빛 속성</option>
                  <option value="어둠" ${elType==='어둠'?'selected':''}>🌑 어둠 속성</option>
                </select>
                <input type="text" id="edit_m_materials_${m.firestoreId}" value="${escapeHtml(m.materials || '')}" placeholder="필요 재료">
                <input type="text" id="edit_m_location_${m.firestoreId}" value="${escapeHtml(m.location || '')}" placeholder="해금 조건">
                <textarea id="edit_m_desc_${m.firestoreId}" rows="2" placeholder="상세 공략">${escapeHtml(m.description || '')}</textarea>
                <input type="text" id="edit_m_img_${m.firestoreId}" value="${escapeHtml(m.image || '')}" placeholder="이미지 URL">
                
                <div style="display:flex; gap:6px; margin-top:8px;">
                  <button onclick="saveInlineEditMagic('${m.firestoreId}')" style="flex:1; padding:6px;">저장</button>
                  <button class="btn-secondary" onclick="cancelInlineEditMagic()" style="flex:1; padding:6px;">취소</button>
                </div>
              </div>
            </div>
          `;
        } else {
          grid.innerHTML += `
            <div class="magic-card ${isCompleted ? 'completed' : ''}">
              <div class="card-action-btns">
                <button onclick="startInlineEditMagic('${m.firestoreId}')">수정</button>
                <button onclick="deleteMagic('${m.firestoreId}')" style="color:#fc8181;">삭제</button>
              </div>
              <span class="badge badge-${elType}">${elType} 속성</span>
              <div class="card-title" style="margin-right: 80px;">${escapeHtml(m.title)}</div>
              <div class="card-subtitle">최종 수정자: ${escapeHtml(m.author)} | ${m.date}</div>
              ${m.image ? `<img src="${escapeHtml(m.image)}" class="magic-img" onclick="openImageModal('${escapeHtml(m.image)}', event)" alt="마법 이미지">` : ''}
              <div class="info-box">
                <div class="info-row">필요 재료: <span>${escapeHtml(m.materials || '미입력')}</span></div>
                <div class="info-row">해금 조건: <span>${escapeHtml(m.location || '미입력')}</span></div>
              </div>
              ${m.description ? `<div style="font-size:13px; color:#cbd5e0; margin-top:10px; white-space:pre-wrap; line-height: 1.4;">${escapeHtml(m.description)}</div>` : ''}
              
              <div class="checkbox-container" onclick="toggleCompletion('${m.firestoreId}', event)" style="cursor:pointer;">
                <span>🏆 내 해금 완료 체크</span>
                <input type="checkbox" ${isCompleted ? 'checked' : ''} style="width:18px; height:18px; cursor:pointer; margin-bottom:0;" onclick="event.stopPropagation(); toggleCompletion('${m.firestoreId}', event)">
              </div>
            </div>
          `;
        }
      });
    }

    function renderAlchemys() {
      const grid = document.getElementById('alchemyGrid');
      grid.innerHTML = '';

      if(store.alchemys.length === 0) {
        grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; text-align:center;">등록된 연금술 레시피가 없습니다.</p>`;
        return;
      }

      store.alchemys.forEach(a => {
        const isEditing = (editingAlchemyId === a.firestoreId);

        if (isEditing) {
          grid.innerHTML += `
            <div class="magic-card">
              <span class="badge" style="background-color:#d69e2e; color:#000;">수정 모드</span>
              <div class="inline-edit-box">
                <input type="text" id="edit_a_title_${a.firestoreId}" value="${escapeHtml(a.title)}" placeholder="조합 결과물 이름">
                <input type="text" id="edit_a_ingredients_${a.firestoreId}" value="${escapeHtml(a.ingredients || '')}" placeholder="조합 재료">
                <input type="text" id="edit_a_location_${a.firestoreId}" value="${escapeHtml(a.location || '')}" placeholder="조합 장소">
                <textarea id="edit_a_desc_${a.firestoreId}" rows="2" placeholder="제조 팁">${escapeHtml(a.description || '')}</textarea>
                <input type="text" id="edit_a_img_${a.firestoreId}" value="${escapeHtml(a.image || '')}" placeholder="이미지 URL">
                
                <div style="display:flex; gap:6px; margin-top:8px;">
                  <button onclick="saveInlineEditAlchemy('${a.firestoreId}')" style="flex:1; padding:6px;">저장</button>
                  <button class="btn-secondary" onclick="cancelInlineEditAlchemy()" style="flex:1; padding:6px;">취소</button>
                </div>
              </div>
            </div>
          `;
        } else {
          grid.innerHTML += `
            <div class="magic-card">
              <div class="card-action-btns">
                <button onclick="startInlineEditAlchemy('${a.firestoreId}')">수정</button>
                <button onclick="deleteAlchemy('${a.firestoreId}')" style="color:#fc8181;">삭제</button>
              </div>
              <span class="badge" style="background-color:#d69e2e; color:#000;">🧪 연금술</span>
              <div class="card-title" style="margin-right: 80px;">${escapeHtml(a.title)}</div>
              <div class="card-subtitle">최종 수정자: ${escapeHtml(a.author)} | ${a.date}</div>
              ${a.image ? `<img src="${escapeHtml(a.image)}" class="magic-img" onclick="openImageModal('${escapeHtml(a.image)}', event)" alt="연금술 이미지">` : ''}
              <div class="info-box">
                <div class="info-row">조합 재료: <span>${escapeHtml(a.ingredients || '미입력')}</span></div>
                <div class="info-row">조합 장소: <span>${escapeHtml(a.location || '미입력')}</span></div>
              </div>
              ${a.description ? `<div style="font-size:13px; color:#cbd5e0; margin-top:10px; white-space:pre-wrap; line-height: 1.4;">${escapeHtml(a.description)}</div>` : ''}
            </div>
          `;
        }
      });
    }

    function renderNotices() {
      const nList = document.getElementById('noticeList');
      nList.innerHTML = store.notices.length === 0 ? `<p style="color:#777; text-align:center;">등록된 공지사항이 없습니다.</p>` : '';
      store.notices.forEach(n => {
        nList.innerHTML += `
          <div class="card">
            <h4 style="margin:0 0 5px 0; color:var(--accent-color);">${escapeHtml(n.title)}</h4>
            <div style="font-size:11px; color:#a0aec0; margin-bottom:8px;">${n.date}</div>
            <div style="font-size:14px; white-space:pre-wrap;">${escapeHtml(n.content)}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
