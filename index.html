<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아르케온 기숙사 - 마법해금 연구소</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181c24;
      --accent-color: #8a2be2;
      --accent-hover: #9c3eee;
      --text-color: #e2e8f0;
      --border-color: #2d3748;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .header h1 {
      color: var(--accent-color);
      margin: 0 0 5px 0;
      font-size: 26px;
    }

    .user-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 0.85em;
      flex-wrap: wrap;
    }

    .tab-menu {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #0f1115;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
    }

    button:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #4a5568; color: #fff; }
    .btn-danger { background-color: #e53e3e; color: #fff; }

    .action-bar {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .magic-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      position: relative;
    }

    .magic-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
      background-color: #0f1115;
      cursor: pointer;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #fff;
    }

    .card-subtitle {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      background-color: #2b6cb0;
      color: #fff;
    }

    .info-row {
      font-size: 13px;
      color: #a0aec0;
      margin-bottom: 5px;
    }

    .info-row span {
      color: #fff;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    #imageModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }

    #expandedImg {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 8px;
    }

    .card-action-btns {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 5px;
    }

    .card-action-btns button {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 5px;
    }
  </style>

  <!-- Firebase SDK 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCL-9nkL26H-ZQufDznXERNlf_eDeHmwjs",
      authDomain: "sanhaegung-dea90.firebaseapp.com",
      projectId: "sanhaegung-dea90",
      storageBucket: "sanhaegung-dea90.firebasestorage.app",
      messagingSenderId: "876388941028",
      appId: "1:876388941028:web:51b83acd86fb1ef709c0f1",
      measurementId: "G-9B699532TC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>✨ 아르케온 기숙사 마법해금 연구소</h1>
      <p style="font-size: 0.9em; margin: 5px 0 0 0; color: #a0aec0;">SOOP 마인크래프트 서버 '차카데미' 아르케온 기숙사 전용 공유소</p>
    </div>

    <div class="user-bar">
      <span id="userInfoDisplay" style="align-self: center; margin-right: auto; color: #a0aec0;">전체 시청자 모드 (조회 전용)</span>
      <button onclick="openMagicForm()">+ 해금 정보 등록 (스트리머 전용)</button>
    </div>

    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('magic')">🔮 마법해금 조건 공유</button>
      <button class="tab-btn" onclick="switchTab('notice')">📢 공지사항</button>
    </div>

    <!-- 1. 마법해금 조건 공유 탭 -->
    <div id="tab-magic" class="tab-content active">
      <div class="action-bar">
        <h3>아르케온 마법 해금 리스트</h3>
      </div>

      <!-- 등록/수정 폼 -->
      <div id="form-magic-card" class="card" style="display:none;">
        <h4 id="magicFormTitle" style="color:var(--accent-color); margin-top:0;">새 마법해금 정보 등록</h4>
        <input type="hidden" id="editMagicId" value="">
        <input type="text" id="magTitle" placeholder="마법 이름 (예: 파이어볼 2단계)">
        <input type="text" id="magAuthor" placeholder="스트리머 닉네임">
        <input type="text" id="magMaterials" placeholder="필요 재료 (예: 마력 결정 5개)">
        <input type="text" id="magLocation" placeholder="해금 위치 / 조건">
        <textarea id="magDesc" rows="3" placeholder="상세 공략 및 주의사항 (선택사항)"></textarea>
        <label style="font-size: 0.85em; color: #a0aec0;">해금 위치/재료 인증 사진:</label>
        <input type="file" id="magFile" accept="image/*" style="margin-top:5px;">
        <input type="password" id="magSecretPw" placeholder="스트리머 비밀번호 입력">
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveMagic()">확인 및 저장</button>
          <button class="btn-secondary" onclick="closeMagicForm()">취소</button>
        </div>
      </div>

      <div id="magicGrid" class="grid-container"></div>
    </div>

    <!-- 2. 공지사항 탭 -->
    <div id="tab-notice" class="tab-content">
      <div class="action-bar">
        <h3>기숙사 공지사항</h3>
      </div>
      <div id="noticeList"></div>
    </div>
  </div>

  <!-- 이미지 확대 모달 -->
  <div id="imageModal" onclick="closeImageModal()">
    <img id="expandedImg" src="">
  </div>

  <!-- 스트리머 비밀번호 확인 모달 (수정/삭제용) -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:var(--accent-color);">스트리머 권한 확인</h3>
      <p style="font-size:0.85em; color:#a0aec0;">해당 정보를 수정/삭제하려면 스트리머 비밀번호를 입력하세요.</p>
      <input type="hidden" id="targetActionId" value="">
      <input type="hidden" id="targetActionType" value="">
      <input type="password" id="checkSecretPw" placeholder="스트리머 비밀번호">
      <button onclick="verifyAndExecute()" style="width:100%; margin-top:5px;">확인</button>
      <button class="btn-secondary" onclick="closeModals()" style="width:100%; margin-top:5px;">닫기</button>
    </div>
  </div>

  <script>
    // 🔑 스트리머 공용 비밀번호 (원하시는 비밀번호로 자유롭게 변경 가능합니다!)
    const STREAMER_PASSWORD = "archeonsu"; 

    let store = {
      magics: [],
      notices: []
    };

    window.addEventListener('firebase-ready', async () => {
      await loadAllData();
      renderAll();
    });

    async function loadAllData() {
      try {
        const mSnap = await getDocs(collection(window.db, "archeon_magics"));
        store.magics = mSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);

        const nSnap = await getDocs(collection(window.db, "archeon_notices"));
        store.notices = nSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => b.id - a.id);
      } catch (e) {
        console.error("데이터 로딩 실패:", e);
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function openImageModal(imgSrc, event) {
      if(event) event.stopPropagation();
      document.getElementById('expandedImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() { document.getElementById('imageModal').style.display = 'none'; }

    // --- 마법해금 등록/수정 폼 제어 ---
    function openMagicForm(editId = null) {
      document.getElementById('form-magic-card').style.display = 'block';
      document.getElementById('magSecretPw').value = '';
      if(editId) {
        document.getElementById('magicFormTitle').innerText = "마법해금 정보 수정";
        document.getElementById('editMagicId').value = editId;
        const target = store.magics.find(m => m.firestoreId === editId);
        if(target) {
          document.getElementById('magTitle').value = target.title || '';
          document.getElementById('magAuthor').value = target.author || '';
          document.getElementById('magMaterials').value = target.materials || '';
          document.getElementById('magLocation').value = target.location || '';
          document.getElementById('magDesc').value = target.description || '';
        }
      } else {
        document.getElementById('magicFormTitle').innerText = "새 마법해금 정보 등록";
        document.getElementById('editMagicId').value = '';
        document.getElementById('magTitle').value = '';
        document.getElementById('magAuthor').value = '';
        document.getElementById('magMaterials').value = '';
        document.getElementById('magLocation').value = '';
        document.getElementById('magDesc').value = '';
        document.getElementById('magFile').value = '';
      }
    }

    function closeMagicForm() { document.getElementById('form-magic-card').style.display = 'none'; }

    async function saveMagic() {
      const pwInput = document.getElementById('magSecretPw').value.trim();
      if(pwInput !== STREAMER_PASSWORD) {
        alert("스트리머 비밀번호가 틀렸습니다! 시청자는 등록할 수 없습니다.");
        return;
      }

      const title = document.getElementById('magTitle').value.trim();
      const author = document.getElementById('magAuthor').value.trim();
      const materials = document.getElementById('magMaterials').value.trim();
      const location = document.getElementById('magLocation').value.trim();
      const description = document.getElementById('magDesc').value.trim();
      const fileInput = document.getElementById('magFile');
      const editId = document.getElementById('editMagicId').value;

      if(!title || !author) { alert("마법 이름과 스트리머 닉네임은 필수입니다."); return; }

      let imageUrl = "";
      if(editId) {
        const existing = store.magics.find(m => m.firestoreId === editId);
        if(existing) imageUrl = existing.image || "";
      }

      if(fileInput.files && fileInput.files[0]) {
        imageUrl = await compressImage(fileInput.files[0]);
      }

      if(editId) {
        const target = store.magics.find(m => m.firestoreId === editId);
        if(target) {
          target.title = title;
          target.author = author;
          target.materials = materials;
          target.location = location;
          target.description = description;
          target.image = imageUrl;

          await updateDoc(doc(window.db, "archeon_magics", editId), {
            title, author, materials, location, description, image: imageUrl
          });
        }
      } else {
        const newMagic = {
          id: Date.now(),
          title, author, materials, location, description,
          image: imageUrl,
          date: new Date().toLocaleDateString()
        };
        const docRef = await addDoc(collection(window.db, "archeon_magics"), newMagic);
        store.magics.unshift({ firestoreId: docRef.id, ...newMagic });
      }

      closeMagicForm();
      renderMagics();
      alert("성공적으로 저장되었습니다!");
    }

    // --- 수정/삭제 권한 인증 모달 ---
    function requestAuth(actionType, firestoreId) {
      document.getElementById('targetActionType').value = actionType;
      document.getElementById('targetActionId').value = firestoreId;
      document.getElementById('checkSecretPw').value = '';
      document.getElementById('authModal').style.display = 'flex';
    }

    async function verifyAndExecute() {
      const pwInput = document.getElementById('checkSecretPw').value.trim();
      if(pwInput !== STREAMER_PASSWORD) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      const actionType = document.getElementById('targetActionType').value;
      const firestoreId = document.getElementById('targetActionId').value;
      closeModals();

      if(actionType === 'edit') {
        openMagicForm(firestoreId);
      } else if(actionType === 'delete') {
        if(!confirm("정말 이 해금 정보를 삭제하시겠습니까?")) return;
        await deleteDoc(doc(window.db, "archeon_magics", firestoreId));
        store.magics = store.magics.filter(m => m.firestoreId !== firestoreId);
        renderMagics();
        alert("삭제되었습니다.");
      }
    }

    // 이미지 압축 헬퍼
    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function renderAll() {
      renderMagics();
      renderNotices();
    }

    function renderMagics() {
      const grid = document.getElementById('magicGrid');
      grid.innerHTML = '';
      if(store.magics.length === 0) {
        grid.innerHTML = `<p style="color:#777; grid-column: 1/-1; text-align:center;">등록된 아르케온 마법 해금 조건이 없습니다.</p>`;
        return;
      }

      store.magics.forEach(m => {
        grid.innerHTML += `
          <div class="magic-card">
            <div class="card-action-btns">
              <button onclick="requestAuth('edit', '${m.firestoreId}')">수정</button>
              <button onclick="requestAuth('delete', '${m.firestoreId}')" style="color:#e53e3e;">삭제</button>
            </div>
            <span class="badge">아르케온 마법</span>
            <div class="card-title" style="margin-right: 70px;">${escapeHtml(m.title)}</div>
            <div class="card-subtitle">스트리머: ${escapeHtml(m.author)} (${m.date})</div>
            ${m.image ? `<img src="${m.image}" class="magic-img" onclick="openImageModal('${m.image}', event)" alt="마법 인증샷">` : ''}
            <div class="info-row">필요 재료: <span>${escapeHtml(m.materials || '미입력')}</span></div>
            <div class="info-row">해금 위치: <span>${escapeHtml(m.location || '미입력')}</span></div>
            ${m.description ? `<div style="font-size:13px; color:#cbd5e0; margin-top:8px; white-space:pre-wrap;">${escapeHtml(m.description)}</div>` : ''}
          </div>
        `;
      });
    }

    function renderNotices() {
      const nList = document.getElementById('noticeList');
      nList.innerHTML = store.notices.length === 0 ? `<p style="color:#777; text-align:center;">등록된 공지사항이 없습니다.</p>` : '';
      store.notices.forEach(n => {
        nList.innerHTML += `
          <div class="card">
            <h4 style="margin:0 0 5px 0; color:var(--accent-color);">${escapeHtml(n.title)}</h4>
            <div style="font-size:11px; color:#a0aec0; margin-bottom:8px;">${n.date}</div>
            <div style="font-size:14px; white-space:pre-wrap;">${escapeHtml(n.content)}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
