<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아르케온 기숙사 - 마법해금 & 연금술 연구소</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181c24;
      --accent-color: #8a2be2;
      --accent-hover: #9c3eee;
      --text-color: #e2e8f0;
      --border-color: #2d3748;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .header h1 {
      color: var(--accent-color);
      margin: 0 0 5px 0;
      font-size: 26px;
    }

    /* 유저 상단 바 & 달성도 대시보드 */
    .user-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .user-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .progress-dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .progress-chip {
      background: #0f1115;
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      color: #cbd5e0;
    }

    .progress-chip strong {
      color: var(--accent-color);
    }

    .tab-menu {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filter-search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .element-sub-tabs, .status-sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 5px;
    }

    .element-sub-btn, .status-sub-btn {
      background-color: #181818;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .element-sub-btn.active, .status-sub-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .search-input-box {
      min-width: 200px;
      flex: 1;
    }

    .search-input-box input {
      margin-bottom: 0;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #0f1115;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
    }

    button:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #4a5568; color: #fff; }

    .action-bar {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .magic-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
    }
    .magic-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .magic-img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      margin: 10px 0;
      background-color: #0f1115;
      cursor: pointer;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      width: fit-content;
    }
    .badge-바람 { background-color: #319795; color: #fff; }
    .badge-화염 { background-color: #dd6b20; color: #fff; }
    .badge-물 { background-color: #3182ce; color: #fff; }
    .badge-대지 { background-color: #276749; color: #fff; }
    .badge-빛 { background-color: #d69e2e; color: #000; }
    .badge-어둠 { background-color: #4a5568; color: #fff; }
    .badge-연금술 { background-color: #d69e2e; color: #000; }

    .info-box {
      background-color: rgba(15, 17, 21, 0.6);
      border-radius: 6px;
      padding: 10px;
      margin-top: auto;
      font-size: 13px;
    }

    .info-row {
      margin-bottom: 4px;
      color: #cbd5e0;
      display: flex;
      justify-content: space-between;
    }
    .info-row span {
      color: #fff;
      font-weight: bold;
      text-align: right;
    }

    /* 개개인 습득 체크 영역 */
    .learn-check-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .learn-btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #12151c;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: bold;
    }
    .learn-btn.learned {
      background: #276749;
      color: #fff;
      border-color: #38a169;
    }

    .learned-users-tag {
      font-size: 11px;
      color: #a0aec0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin-top: 4px;
    }
    .user-badge {
      background: #2d3748;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 교수 선물 가로 표 */
    .gift-table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }
    .gift-table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text-color);
      text-align: left;
      font-size: 14px;
    }
    .gift-table th {
      background-color: #0f1115;
      color: var(--accent-color);
      padding: 12px 16px;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
    }
    .gift-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      line-height: 1.5;
    }
    .gift-prof-badge {
      display: inline-block;
      background-color: #2d3748;
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--border-color);
    }

    #imageModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }

    #expandedImg { max-width: 95%; max-height: 85vh; border-radius: 8px; }

    .card-action-btns {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }
    .card-action-btns button {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      color: #cbd5e0;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .card-action-btns button:hover { background-color: var(--accent-color); color: #fff; }
  </style>

  <!-- Firebase SDK 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCL-9nkL26H-ZQufDznXERNlf_eDeHmwjs",
      authDomain: "sanhaegung-dea90.firebaseapp.com",
      projectId: "sanhaegung-dea90",
      storageBucket: "sanhaegung-dea90.firebasestorage.app",
      messagingSenderId: "876388941028",
      appId: "1:876388941028:web:51b83acd86fb1ef709c0f1",
      measurementId: "G-9B699532TC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 아르케온 스트리머 명단 (51명)
    const STREAMERS = [
      "강만식", "띵굴", "사과몽", "쥐돌이", "킴성태", "오아", "린링", "푸닝", "구월이", "딸기슈몽이", "연우암",
      "임구산", "유즈코", "미링", "한아련", "슈야", "김성진", "현단아", "제복이", "잼율이", "해또잉",
      "김나오", "복새달", "잠결", "고채린", "첼시냥", "김쁘피", "꾕아지", "꿈틀", "상득", "린코", "류새콤", "윤이결",
      "밍가연", "카푸", "엘리스암", "모바샤", "망개", "나몽", "콧시", "스위데", "콘치", "요한.3.", "시몽", "김뱅글",
      "지한이또", "김멘탈", "한예림", "냥이웅", "뽀이_v", "개리"
    ];

    let currentLoggedInUser = localStorage.getItem("arche_user") || "";
    let magicList = [];
    let giftList = [];
    let currentElementTab = '전체';
    let currentStatusTab = '전체'; // '전체' | '해금완료' | '미해금'

    window.addEventListener('DOMContentLoaded', () => {
      initAuth();
      loadData();
      setupTabs();
      setupModals();
    });

    // 1. 최초 접속 인증 모달
    function initAuth() {
      const selectEl = document.getElementById('loginUserSelect');
      STREAMERS.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        selectEl.appendChild(opt);
      });

      if (!currentLoggedInUser) {
        document.getElementById('loginModal').style.display = 'flex';
      } else {
        updateUserBar();
      }
    }

    window.handleLogin = function() {
      const pw = document.getElementById('loginPassword').value.trim();
      const userName = document.getElementById('loginUserSelect').value;

      if (pw !== "1234" && pw !== "rinring") {
        alert("비밀번호가 틀렸습니다!");
        return;
      }
      if (!userName) {
        alert("본인의 닉네임을 선택해주세요!");
        return;
      }

      currentLoggedInUser = userName;
      localStorage.setItem("arche_user", userName);
      document.getElementById('loginModal').style.display = 'none';
      updateUserBar();
      renderMagics();
    };

    window.switchUser = function() {
      localStorage.removeItem("arche_user");
      location.reload();
    };

    function updateUserBar() {
      document.getElementById('currentUserDisplay').innerHTML = `현재 접속자: <strong style="color:var(--accent-color);">${currentLoggedInUser}</strong>님`;
      updateProgressDashboard();
    }

    // 개개인별 해금 수량 실시간 대시보드 계산 (N/M개)
    function updateProgressDashboard() {
      if (!currentLoggedInUser) return;

      const elements = ['바람', '화염', '물', '대지', '빛', '어둠', '연금술'];
      const counts = { 전체: { total: magicList.length, learned: 0 } };

      elements.forEach(el => { counts[el] = { total: 0, learned: 0 }; });

      magicList.forEach(item => {
        const learnedUsers = item.learnedUsers || [];
        const isLearned = learnedUsers.includes(currentLoggedInUser);

        if (isLearned) counts.전체.learned++;

        if (counts[item.element]) {
          counts[item.element].total++;
          if (isLearned) counts[item.element].learned++;
        }
      });

      const dashboard = document.getElementById('progressDashboard');
      let html = `<div class="progress-chip">📊 전체: <strong>${counts.전체.learned}/${counts.전체.total}</strong></div>`;

      elements.forEach(el => {
        if (counts[el].total > 0) {
          html += `<div class="progress-chip">${el}: <strong>${counts[el].learned}/${counts[el].total}</strong></div>`;
        }
      });

      dashboard.innerHTML = html;
    }

    // 2. 탭 바인딩
    function setupTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          const targetId = e.target.getAttribute('data-tab');
          document.getElementById(targetId).classList.add('active');
        });
      });
    }

    // 3. 파이어베이스 데이터 로드
    async function loadData() {
      try {
        const magicSnap = await getDocs(collection(db, "archeon_magics"));
        magicList = magicSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        const giftSnap = await getDocs(collection(db, "archeon_gifts"));
        giftList = giftSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        renderMagics();
        renderGifts();
      } catch (err) {
        console.error("데이터 로드 실패:", err);
      }
    }

    // 4. 마법 카드 렌더링 & 개개인별 필터링
    window.renderMagics = function() {
      updateProgressDashboard();

      const container = document.getElementById('magicGrid');
      const searchKeyword = document.getElementById('magicSearchInput') ? document.getElementById('magicSearchInput').value.toLowerCase().trim() : '';
      
      container.innerHTML = '';

      const filtered = magicList.filter(item => {
        const matchesElement = (currentElementTab === '전체' || item.element === currentElementTab);
        const matchesSearch = (!searchKeyword || 
          (item.title && item.title.toLowerCase().includes(searchKeyword)) || 
          (item.desc && item.desc.toLowerCase().includes(searchKeyword)) ||
          (item.materials && item.materials.toLowerCase().includes(searchKeyword))
        );
        
        const learnedUsers = item.learnedUsers || [];
        const isMyLearned = learnedUsers.includes(currentLoggedInUser);

        let matchesStatus = true;
        if (currentStatusTab === '해금완료') {
          matchesStatus = isMyLearned;
        } else if (currentStatusTab === '미해금') {
          matchesStatus = !isMyLearned;
        }

        return matchesElement && matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#718096; padding: 40px;">조건에 일치하는 마법 정보가 없습니다.</div>`;
        return;
      }

      filtered.forEach(item => {
        const learnedUsers = item.learnedUsers || [];
        const isLearnedByMe = learnedUsers.includes(currentLoggedInUser);

        const card = document.createElement('div');
        card.className = 'magic-card';
        card.innerHTML = `
          <div class="card-action-btns">
            <button onclick="openEditMagicModal('${item.id}')">수정</button>
            <button onclick="deleteMagic('${item.id}')" style="color:#fc8181;">삭제</button>
          </div>
          <span class="badge badge-${item.element || '바람'}">${item.element || '바람'} 속성</span>
          <div class="card-title">${item.title}</div>
          <div class="card-subtitle">획득처 / 해금 조건</div>
          ${item.imageUrl ? `<img src="${item.imageUrl}" class="magic-img" onclick="expandImage('${item.imageUrl}')">` : ''}
          
          <div class="info-box" style="margin-bottom: 10px;">
            <div class="info-row">필요 재료: <span>${item.materials || '미입력'}</span></div>
            <div class="info-row">해금 조건: <span>${item.location || '미입력'}</span></div>
          </div>

          ${item.desc ? `<div style="font-size: 13px; color: #cbd5e0; white-space: pre-line; margin-bottom: 10px;">${item.desc}</div>` : ''}
          
          <!-- 개개인 습득 체크 영역 -->
          <div class="learn-check-box">
            <button class="learn-btn ${isLearnedByMe ? 'learned' : ''}" onclick="toggleLearnMagic('${item.id}')">
              ${isLearnedByMe ? '☑️ 내 해금 완료 (취소하려면 클릭)' : '☐ 내 해금 체크하기'}
            </button>
            <div class="learned-users-tag">
              <span>해금한 스트리머 (${learnedUsers.length}명):</span>
              ${learnedUsers.length > 0 ? learnedUsers.map(u => `<span class="user-badge">${u}</span>`).join('') : '<span style="color:#718096">없음</span>'}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    };

    window.setElementTab = function(el, btn) {
      currentElementTab = el;
      document.querySelectorAll('.element-sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMagics();
    };

    window.setStatusTab = function(status, btn) {
      currentStatusTab = status;
      document.querySelectorAll('.status-sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMagics();
    };

    // 해금 상태 토글 함수
    window.toggleLearnMagic = async function(id) {
      if (!currentLoggedInUser) {
        alert("로그인 정보가 없습니다.");
        return;
      }

      const itemRef = doc(db, "archeon_magics", id);
      const target = magicList.find(m => m.id === id);
      if (!target) return;

      let learnedUsers = target.learnedUsers || [];
      if (learnedUsers.includes(currentLoggedInUser)) {
        learnedUsers = learnedUsers.filter(u => u !== currentLoggedInUser);
      } else {
        learnedUsers.push(currentLoggedInUser);
      }

      try {
        await updateDoc(itemRef, { learnedUsers: learnedUsers });
        target.learnedUsers = learnedUsers;
        renderMagics();
      } catch (err) {
        console.error("해금 상태 업데이트 실패:", err);
        alert("업데이트 중 오류가 발생했습니다.");
      }
    };

    // 5. 교수별 선물 가로 표 렌더링
    window.renderGifts = function() {
      const tbody = document.getElementById('giftTableBody');
      const searchKeyword = document.getElementById('giftSearchInput') ? document.getElementById('giftSearchInput').value.toLowerCase().trim() : '';
      tbody.innerHTML = '';

      const filtered = giftList.filter(item => {
        return (!searchKeyword || 
          (item.professor && item.professor.toLowerCase().includes(searchKeyword)) ||
          (item.giftName && item.giftName.toLowerCase().includes(searchKeyword)) ||
          (item.desc && item.desc.toLowerCase().includes(searchKeyword))
        );
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#718096; padding: 30px;">등록된 선물 정보가 없습니다.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="gift-prof-badge">🎓 ${item.professor}</span></td>
          <td style="font-weight: bold; color: #fff;">${item.giftName}</td>
          <td>${item.imageUrl ? `<img src="${item.imageUrl}" style="max-height:70px; border-radius:6px; cursor:pointer;" onclick="expandImage('${item.imageUrl}')">` : '이미지 없음'}</td>
          <td style="color: #cbd5e0; white-space: pre-line;">${item.desc || ''}</td>
        `;
        tbody.appendChild(tr);
      });
    };

    // 6. 모달
    function setupModals() {
      window.openAddMagicModal = () => {
        document.getElementById('magicModalTitle').innerText = "새 마법/연금술 등록";
        document.getElementById('magicId').value = "";
        document.getElementById('mTitle').value = "";
        document.getElementById('mElement').value = "바람";
        document.getElementById('mMaterials').value = "";
        document.getElementById('mLocation').value = "";
        document.getElementById('mImageUrl').value = "";
        document.getElementById('mDesc').value = "";
        document.getElementById('magicModal').style.display = 'flex';
      };

      window.openEditMagicModal = (id) => {
        const item = magicList.find(m => m.id === id);
        if (!item) return;
        document.getElementById('magicModalTitle').innerText = "마법/연금술 수정";
        document.getElementById('magicId').value = item.id;
        document.getElementById('mTitle').value = item.title || "";
        document.getElementById('mElement').value = item.element || "바람";
        document.getElementById('mMaterials').value = item.materials || "";
        document.getElementById('mLocation').value = item.location || "";
        document.getElementById('mImageUrl').value = item.imageUrl || "";
        document.getElementById('mDesc').value = item.desc || "";
        document.getElementById('magicModal').style.display = 'flex';
      };

      window.closeMagicModal = () => { document.getElementById('magicModal').style.display = 'none'; };

      window.openAddGiftModal = () => { document.getElementById('giftModal').style.display = 'flex'; };
      window.closeGiftModal = () => { document.getElementById('giftModal').style.display = 'none'; };

      window.expandImage = (url) => {
        document.getElementById('expandedImg').src = url;
        document.getElementById('imageModal').style.display = 'flex';
      };

      window.closeImageModal = () => { document.getElementById('imageModal').style.display = 'none'; };
    }

    window.saveMagic = async function() {
      const id = document.getElementById('magicId').value;
      const title = document.getElementById('mTitle').value.trim();
      const element = document.getElementById('mElement').value;
      const materials = document.getElementById('mMaterials').value.trim();
      const location = document.getElementById('mLocation').value.trim();
      const imageUrl = document.getElementById('mImageUrl').value.trim();
      const desc = document.getElementById('mDesc').value.trim();

      if (!title) {
        alert("마법 이름을 입력해주세요!");
        return;
      }

      try {
        if (id) {
          await updateDoc(doc(db, "archeon_magics", id), { title, element, materials, location, imageUrl, desc });
        } else {
          await addDoc(collection(db, "archeon_magics"), { title, element, materials, location, imageUrl, desc, learnedUsers: [] });
        }
        closeMagicModal();
        loadData();
      } catch (err) {
        console.error("저장 실패:", err);
        alert("저장 중 오류가 발생했습니다.");
      }
    };

    window.deleteMagic = async function(id) {
      if (!confirm("정말 이 항목을 삭제하시겠습니까?")) return;
      try {
        await deleteDoc(doc(db, "archeon_magics", id));
        loadData();
      } catch (err) {
        console.error("삭제 실패:", err);
        alert("삭제 중 오류가 발생했습니다.");
      }
    };

    window.saveGift = async function() {
      const professor = document.getElementById('gProf').value.trim();
      const giftName = document.getElementById('gName').value.trim();
      const imageUrl = document.getElementById('gImageUrl').value.trim();
      const desc = document.getElementById('gDesc').value.trim();

      if (!professor || !giftName) {
        alert("교수 이름과 선물 이름을 모두 입력해주세요!");
        return;
      }

      try {
        await addDoc(collection(db, "archeon_gifts"), { professor, giftName, imageUrl, desc });
        closeGiftModal();
        loadData();
        document.getElementById('gProf').value = "";
        document.getElementById('gName').value = "";
        document.getElementById('gImageUrl').value = "";
        document.getElementById('gDesc').value = "";
      } catch (err) {
        console.error("선물 등록 실패:", err);
        alert("등록 중 오류가 발생했습니다.");
      }
    };
  </script>
</head>
<body>

  <!-- 최초 접속 로그인 모달 -->
  <div id="loginModal" class="modal">
    <div class="modal-content" style="text-align: center;">
      <h2 style="color: var(--accent-color); margin-top: 0;">🏰 아르케온 기숙사 연구소</h2>
      <p style="font-size: 13px; color: #a0aec0; margin-bottom: 20px;">사이트 이용 및 개인 해금 체크를 위해 비밀번호와 본인 닉네임을 선택해주세요.</p>
      
      <div style="text-align: left; font-size: 13px; margin-bottom: 5px;">스트리머 본인 닉네임 선택</div>
      <select id="loginUserSelect">
        <option value="">-- 본인 닉네임을 선택하세요 --</option>
      </select>

      <div style="text-align: left; font-size: 13px; margin-bottom: 5px; margin-top: 10px;">접속 비밀번호</div>
      <input type="password" id="loginPassword" placeholder="비밀번호를 입력하세요">

      <button onclick="handleLogin()" style="width: 100%; margin-top: 10px; padding: 12px;">입장하기</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h1>🏰 아르케온 기숙사 연구소</h1>
      <p style="margin: 0; font-size: 13px; color: #a0aec0;">SOOP 마인크래프트 서버 '차카데미' 아르케온 기숙사 전용 연구소</p>
    </div>

    <!-- 유저 프로필 & 개인 해금 달성도 대시보드 -->
    <div class="user-bar">
      <div class="user-bar-top">
        <div id="currentUserDisplay">현재 접속자: 확인 중...</div>
        <button class="btn-secondary" onclick="switchUser()" style="padding: 5px 12px; font-size: 12px;">다른 사용자로 변경</button>
      </div>
      <div>
        <div style="font-size: 12px; color: #a0aec0; margin-bottom: 6px;">나의 속성별 마법 해금 현황</div>
        <div class="progress-dashboard" id="progressDashboard">
          <!-- 스크립트로 개수(N/M개) 자동 생성 -->
        </div>
      </div>
    </div>

    <!-- 메인 탭 -->
    <div class="tab-menu">
      <button class="tab-btn active" data-tab="tabMagics">🪄 마법 & 연금술 해금</button>
      <button class="tab-btn" data-tab="tabGifts">🎓 교수별 선물 정보</button>
    </div>

    <!-- 탭 1: 마법 & 연금술 해금 -->
    <div id="tabMagics" class="tab-content active">
      <div class="action-bar">
        <!-- 속성 서브 탭 -->
        <div class="element-sub-tabs">
          <button class="element-sub-btn active" onclick="setElementTab('전체', this)">전체</button>
          <button class="element-sub-btn" onclick="setElementTab('바람', this)">💨 바람</button>
          <button class="element-sub-btn" onclick="setElementTab('화염', this)">🔥 화염</button>
          <button class="element-sub-btn" onclick="setElementTab('물', this)">💧 물</button>
          <button class="element-sub-btn" onclick="setElementTab('대지', this)">🌍 대지</button>
          <button class="element-sub-btn" onclick="setElementTab('빛', this)">✨ 빛</button>
          <button class="element-sub-btn" onclick="setElementTab('어둠', this)">🌑 어둠</button>
          <button class="element-sub-btn" onclick="setElementTab('연금술', this)">🧪 연금술</button>
        </div>

        <button onclick="openAddMagicModal()">+ 새 마법/연금술 등록</button>
      </div>

      <div class="filter-search-bar">
        <!-- 개인 해금 상태 필터 -->
        <div class="status-sub-tabs">
          <button class="status-sub-btn active" onclick="setStatusTab('전체', this)">전체 보기</button>
          <button class="status-sub-btn" onclick="setStatusTab('해금완료', this)">내가 해금한 마법만</button>
          <button class="status-sub-btn" onclick="setStatusTab('미해금', this)">내가 미해금한 마법만</button>
        </div>

        <div class="search-input-box">
          <input type="text" id="magicSearchInput" onkeyup="renderMagics()" placeholder="마법 이름, 재료, 해금조건 검색...">
        </div>
      </div>

      <div id="magicGrid" class="grid-container"></div>
    </div>

    <!-- 탭 2: 교수별 선물 정보 -->
    <div id="tabGifts" class="tab-content">
      <div class="action-bar">
        <div class="search-input-box">
          <input type="text" id="giftSearchInput" onkeyup="renderGifts()" placeholder="교수 이름 또는 선물 이름 검색...">
        </div>
        <button onclick="openAddGiftModal()">+ 새 선물 정보 등록</button>
      </div>

      <div class="gift-table-container">
        <table class="gift-table">
          <thead>
            <tr>
              <th style="width: 150px;">교수명</th>
              <th style="width: 200px;">선물 이름</th>
              <th style="width: 150px;">이미지</th>
              <th>설명 및 획득 방법</th>
            </tr>
          </thead>
          <tbody id="giftTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 마법 등록/수정 모달 -->
  <div id="magicModal" class="modal">
    <div class="modal-content">
      <h3 id="magicModalTitle" style="margin-top:0; color:var(--accent-color);">새 마법/연금술 등록</h3>
      <input type="hidden" id="magicId">
      <input type="text" id="mTitle" placeholder="마법/연금술 이름 (예: 파이어볼 2단계)">
      <select id="mElement">
        <option value="바람">바람</option>
        <option value="화염">화염</option>
        <option value="물">물</option>
        <option value="대지">대지</option>
        <option value="빛">빛</option>
        <option value="어둠">어둠</option>
        <option value="연금술">연금술</option>
      </select>
      <input type="text" id="mMaterials" placeholder="필요 재료 (예: 마력 결정 5개)">
      <input type="text" id="mLocation" placeholder="해금 조건 (예: 네더 요새 몬스터 처치)">
      <input type="text" id="mImageUrl" placeholder="이미지 URL (Imgur 영구 직주소 .jpg/.png 추천)">
      <textarea id="mDesc" rows="4" placeholder="상세 공략 및 주의사항 작성"></textarea>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
        <button class="btn-secondary" onclick="closeMagicModal()">취소</button>
        <button onclick="saveMagic()">저장</button>
      </div>
    </div>
  </div>

  <!-- 선물 등록 모달 -->
  <div id="giftModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:var(--accent-color);">새 교수 선물 정보 등록</h3>
      <input type="text" id="gProf" placeholder="교수 이름 (예: 스네이프)">
      <input type="text" id="gName" placeholder="선물 이름">
      <input type="text" id="gImageUrl" placeholder="이미지 URL (Imgur 영구 직주소 .jpg/.png 추천)">
      <textarea id="gDesc" rows="4" placeholder="선물 효과, 선호도, 획득 방식 등"></textarea>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
        <button class="btn-secondary" onclick="closeGiftModal()">취소</button>
        <button onclick="saveGift()">저장</button>
      </div>
    </div>
  </div>

  <!-- 이미지 확대 모달 -->
  <div id="imageModal" onclick="closeImageModal()">
    <img id="expandedImg" src="">
  </div>

</body>
</html>
