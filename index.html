    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --box-bg: #0f172a;
            --box-border: #475569;
            --text-gold: #fbbf24;
            --text-light: #f8fafc;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--box-border);
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.35rem;
            font-weight: bold;
        }

        .badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: normal;
        }

        .badge-view { background: #334155; color: #94a3b8; }
        .badge-edit { background: #065f46; color: #34d399; }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-lock { background-color: #475569; }
        .btn-add { background-color: var(--success); }
        .btn-col { background-color: #8b5cf6; }
        .btn-pw { background-color: #6366f1; }
        .btn-tab { background-color: #0ea5e9; }

        .tab-bar {
            width: 100%;
            max-width: 1600px;
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tab-btn-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .tab-btn {
            background-color: #334155;
            color: #94a3b8;
            border: 1px solid var(--box-border);
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--panel-bg);
            color: var(--text-gold);
            border-bottom: 2px solid var(--text-gold);
        }

        .tab-del-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.65rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .editable-tabs .tab-del-btn { display: flex; }

        .board-container {
            width: 100%;
            max-width: 1600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--box-border);
            border-radius: 0 8px 8px 8px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-gold);
            padding: 0;
            min-width: 100px;
        }

        th .th-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            position: relative;
        }

        th input {
            color: var(--text-gold);
            font-weight: bold;
            text-align: center;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.98rem;
        }

        .col-btn-group {
            display: none;
            gap: 2px;
            margin-top: 2px;
        }

        .editable .col-btn-group { display: flex; }

        .btn-col-mv, .btn-col-del {
            border: none;
            border-radius: 3px;
            padding: 0 4px;
            font-size: 0.7rem;
            cursor: pointer;
            color: white;
        }
        .btn-col-mv { background: #334155; }
        .btn-col-del { background: var(--danger); }

        td {
            padding: 0;
            vertical-align: middle;
        }

        .td-box {
            background-color: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 6px;
            height: 95px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 6px;
            transition: all 0.2s ease;
            gap: 4px;
            position: relative;

            border-color: var(--warning) !important;
            background-color: rgba(245, 158, 11, 0.08) !important;
        }

        .lock-indicator {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.65rem;
            color: var(--warning);
            font-weight: bold;
        }

        td input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-light);
            text-align: center;
            font-size: 1.05rem;
            outline: none;
        }

        /* --- 직업 색상 설정 --- */
        .job-select {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            text-align-last: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }
        .job-select option { background-color: #1e293b; color: #f8fafc; }

        .job-tag { border-radius: 6px; font-weight: bold; }
        .job-knight { background-color: rgba(30, 58, 138, 0.4) !important; border-color: #3b82f6 !important; }
        .job-knight .job-select { color: #93c5fd !important; }
        
        .job-wizard { background-color: rgba(88, 28, 135, 0.4) !important; border-color: #a855f7 !important; }
        .job-wizard .job-select { color: #d8b4fe !important; }
        
        .job-warrior { background-color: rgba(127, 29, 29, 0.4) !important; border-color: #ef4444 !important; }
        .job-warrior .job-select { color: #fca5a5 !important; }
        
        .job-assassin { background-color: rgba(124, 45, 18, 0.4) !important; border-color: #f97316 !important; }

        .job-hunter { background-color: rgba(6, 78, 59, 0.4) !important; border-color: #10b981 !important; }
        .job-hunter .job-select { color: #6ee7b7 !important; }
        
        .job-default { background-color: rgba(51, 65, 85, 0.3) !important; border-color: #64748b !important; }
        .job-default .job-select { color: #cbd5e1 !important; }

        /* --- 무기 강화 스타일 --- */

            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            text-align-last: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .enchant-default .enchant-select { color: #94a3b8; }
        .enchant-safe { background-color: rgba(15, 23, 42, 0.6) !important; border-color: #475569 !important; }
        .enchant-safe .enchant-select { color: #e2e8f0 !important; }
        .enchant-7 { background-color: rgba(13, 148, 136, 0.3) !important; border-color: #0d9488 !important; box-shadow: inset 0 0 10px rgba(13, 148, 136, 0.3); }
        .enchant-7 .enchant-select { color: #2dd4bf !important; }
        .enchant-8 { background-color: rgba(37, 99, 235, 0.35) !important; border-color: #2563eb !important; box-shadow: inset 0 0 12px rgba(37, 99, 235, 0.4); }
        .enchant-8 .enchant-select { color: #60a5fa !important; }
        .enchant-9 { background-color: rgba(147, 51, 234, 0.45) !important; border-color: #a855f7 !important; box-shadow: 0 0 16px rgba(168, 85, 247, 0.7), inset 0 0 12px rgba(168, 85, 247, 0.4); }
        .enchant-9 .enchant-select { color: #e879f9 !important; text-shadow: 0 0 8px rgba(232, 121, 249, 0.6); }
        .enchant-10 { background-color: rgba(234, 88, 12, 0.5) !important; border-color: #f97316 !important; box-shadow: 0 0 20px rgba(249, 115, 22, 0.8), inset 0 0 15px rgba(249, 115, 22, 0.5); }
        .enchant-10 .enchant-select { color: #fdba74 !important; text-shadow: 0 0 10px rgba(253, 186, 116, 0.8); }
        .enchant-11 { background-color: rgba(220, 38, 38, 0.55) !important; border-color: #ef4444 !important; box-shadow: 0 0 24px rgba(239, 68, 68, 0.9), inset 0 0 18px rgba(239, 68, 68, 0.6); }
        .enchant-11 .enchant-select { color: #fca5a5 !important; text-shadow: 0 0 12px rgba(252, 165, 165, 0.9); }
        .enchant-12 { background-color: rgba(202, 138, 4, 0.5) !important; border-color: #eab308 !important; box-shadow: 0 0 28px rgba(234, 179, 8, 0.9), inset 0 0 20px rgba(234, 179, 8, 0.6); }
        .enchant-12 .enchant-select { color: #facc15 !important; text-shadow: 0 0 14px rgba(250, 204, 21, 0.9); }

        .profile-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px dashed var(--box-border);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .profile-wrap:hover { border-color: var(--text-gold); }
        .profile-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .profile-wrap span { font-size: 0.7rem; color: #94a3b8; font-weight: bold; }
        .file-input { display: none; }

        .btn-action-group { display: flex; gap: 2px; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .btn-move { background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; padding: 6px 10px; }
        .btn-del { background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; padding: 6px 10px; }

        .section-box {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .img-upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .img-card {
            background: var(--panel-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .img-card-preview {
            width: 100%;
            height: 180px;
            background: #0f172a;
            border: 1px dashed var(--box-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .img-card-preview img { width: 100%; height: 100%; object-fit: cover; }
        .img-card-preview span { color: #94a3b8; font-size: 0.95rem; font-weight: bold; }
        .img-card input[type="text"] {
            width: 100%;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-light);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }
        .img-card textarea {
            width: 100%;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-light);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.95rem;
            resize: vertical;
            height: 70px;
            outline: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--box-border);
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title { font-size: 1.2rem; font-weight: bold; color: var(--text-gold); margin-bottom: 16px; }
        .modal-input {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--box-border);
            background: var(--box-bg); color: white; text-align: center; font-size: 1.1rem; margin-bottom: 16px; outline: none;
        }
        .modal-btn-group { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 10px 0; border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
        .modal-btn-submit { background: var(--primary); color: white; }
        .modal-btn-cancel { background: #475569; color: white; }

        .image-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
        }
        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        .image-modal-content img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            border: 2px solid var(--box-border);
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

        window.addEventListener('DOMContentLoaded', () => {
            const dbRefInstance = window.dbRef(window.db, 'kimteam_board');
            window.dbOnValue(dbRefInstance, (snapshot) => {
                const serverData = snapshot.val();
                if (serverData) {
                    if (serverData.specColumns) specColumns = serverData.specColumns;
                    if (serverData.itemColumns) itemColumns = serverData.itemColumns;
                    if (serverData.huntColumns) huntColumns = serverData.huntColumns;
                    if (serverData.membersData) membersData = serverData.membersData;
                    if (serverData.mapImages) mapImages = serverData.mapImages;
                    if (serverData.hiddenJobsData) hiddenJobsData = serverData.hiddenJobsData;
                    if (serverData.customTabs) customTabs = serverData.customTabs;
                    renderAll();
                }
            });
            renderAll();
        });

        function getCurrentColumns() {
            if (activeTab === 'spec') return specColumns;
            if (activeTab === 'item') return itemColumns;
            if (activeTab === 'hunt') return huntColumns;
            return [];
        }

        function getPw() {
            return localStorage.getItem('board_pw') || DEFAULT_PW;
        }

        function switchTab(tab) {
            syncInputsToData();
            activeTab = tab;
            renderAll();
        }

        function openLoginModal() {
            modalMode = 'login';
            document.getElementById('modalTitle').innerText = "🔑 수정 권한 비밀번호";
            document.getElementById('pwInput').style.display = "block";
            document.getElementById('pwInput').value = "";
            document.getElementById('pwInput').placeholder = "비밀번호 입력";
            document.getElementById('pwNewInput').style.display = "none";
            document.getElementById('customTabInput').style.display = "none";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function openPwChangeModal() {
            modalMode = 'change';
            document.getElementById('modalTitle').innerText = "🔑 마스터 비밀번호 변경";
            document.getElementById('pwInput').style.display = "block";
            document.getElementById('pwInput').value = "";
            document.getElementById('pwInput').placeholder = "현재 비밀번호";
            document.getElementById('pwNewInput').style.display = "block";
            document.getElementById('pwNewInput').value = "";
            document.getElementById('customTabInput').style.display = "none";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('pwInput').focus();
        }

        function openAddTabModal() {
            modalMode = 'addTab';
            document.getElementById('modalTitle').innerText = "➕ 새 탭 추가";
            document.getElementById('pwInput').style.display = "none";
            document.getElementById('pwNewInput').style.display = "none";
            document.getElementById('customTabInput').style.display = "block";
            document.getElementById('customTabInput').value = "";
            document.getElementById('pwModal').style.display = "flex";
            document.getElementById('customTabInput').focus();
        }

        function closeModal() {
            document.getElementById('pwModal').style.display = "none";
        }

        function openImageModal(imgSrc) {
            if (!imgSrc) return;
            document.getElementById('modalZoomedImg').src = imgSrc;
            document.getElementById('imageModal').style.display = "flex";
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        function handleModalKey(e) {
            if (e.key === 'Enter') submitModal();
            if (e.key === 'Escape') {
                closeModal();
                closeImageModal();
            }
        }

        function submitModal() {
            if (modalMode === 'login') {
                const inputPw = document.getElementById('pwInput').value;
                if (inputPw === getPw()) {
                    isEdit = true;
                    closeModal();
                    updateUI();
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'change') {
                const inputPw = document.getElementById('pwInput').value;
                const newPw = document.getElementById('pwNewInput').value;
                if (inputPw === getPw()) {
                    if (newPw && newPw.trim()) {
                        localStorage.setItem('board_pw', newPw.trim());
                        alert("비밀번호가 성공적으로 변경되었습니다!");
                        closeModal();
                    } else {
                        alert("새 비밀번호를 입력해주세요.");
                    }
                } else {
                    alert("현재 비밀번호가 틀렸습니다.");
                }
            } else if (modalMode === 'addTab') {
                const tabName = document.getElementById('customTabInput').value;
                if (tabName && tabName.trim()) {
                    const newId = 'custom_' + Date.now();
                    customTabs.push({ id: newId, name: tabName.trim(), content: "새로 만든 탭의 내용을 입력하세요." });
                    activeTab = newId;
                    closeModal();
                    renderAll();
                } else {
                    alert("탭 이름을 입력해주세요.");
                }
            }
        }

        function toggleAuth() {
            if (isEdit) {
                isEdit = false;
                updateUI();
            } else {
                openLoginModal();
            }
        }

        function updateUI() {
            const badge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');
            const addTabBtn = document.getElementById('addTabBtn');
            const saveBtn = document.getElementById('saveBtn');
            const pwChangeBtn = document.getElementById('pwChangeBtn');

            if (isEdit) {
                badge.innerText = "✏️ 수정 모드";
                badge.className = "badge badge-edit";
                authBtn.innerText = "🔒 수정 잠그기";
                saveBtn.style.display = "inline-block";
                pwChangeBtn.style.display = "inline-block";
                addTabBtn.style.display = "inline-block";
                if (activeTab === 'spec' || activeTab === 'item' || activeTab === 'hunt') {
                    addBtn.style.display = "inline-block";
                    addColBtn.style.display = "inline-block";
                } else {
                    addBtn.style.display = "none";
                    addColBtn.style.display = "none";
                }
            } else {
                badge.innerText = "🔒 읽기 전용";
                badge.className = "badge badge-view";
                authBtn.innerText = "🔓 수정 권한 얻기";
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                addTabBtn.style.display = "none";
                saveBtn.style.display = "none";
                pwChangeBtn.style.display = "none";
            }

            renderTabBar();
            renderAll();
        }

        function syncInputsToData() {
            if (activeTab === 'spec' || activeTab === 'item' || activeTab === 'hunt') {
                const cols = getCurrentColumns();
                const headerInputs = document.querySelectorAll('#headerRow input');
                headerInputs.forEach(inp => {
                    const colId = inp.dataset.colid;
                    const colObj = cols.find(c => c.id === colId);
                    if (colObj) colObj.title = inp.value;
                });

                const rows = document.querySelectorAll('#tableBody tr');
                rows.forEach((r, idx) => {
                    if (!membersData[idx]) return;
                    r.querySelectorAll('input[type="text"], select').forEach(inp => {
                        const colId = inp.dataset.colid;
                        if (colId) membersData[idx][colId] = inp.value;
                    });
                });
            } else if (activeTab === 'map') {
                mapImages.forEach((item, idx) => {
                    const titleElem = document.getElementById(`map_title_${idx}`);
                    const memoElem = document.getElementById(`map_memo_${idx}`);
                    if (titleElem) item.title = titleElem.value;
                    if (memoElem) item.memo = memoElem.value;
                });
            } else if (activeTab === 'hidden') {
                hiddenJobsData.forEach((job, jobIndex) => {
                    const nameElem = document.getElementById(`hidden_name_${jobIndex}`);
                    if (nameElem) job.name = nameElem.value;
                    
                    if (job.items) {
                        job.items.forEach((item, itemIndex) => {
                            const memoElem = document.getElementById(`hidden_memo_${jobIndex}_${itemIndex}`);
                            if (memoElem) item.memo = memoElem.value;
                        });
                    }
                });
            } else {
                const txtArea = document.getElementById('customTextArea');
                if (txtArea) {
                    const found = customTabs.find(t => t.id === activeTab);
                    if (found) found.content = txtArea.value;
                }
            }
        }

        function renderTabBar() {
            const tabBar = document.getElementById('tabBar');
            let html = `
                <div class="tab-btn-wrap"><button id="tabSpec" class="tab-btn ${activeTab === 'spec' ? 'active' : ''}" onclick="switchTab('spec')">⚔️ 스펙 현황</button></div>
                <div class="tab-btn-wrap"><button id="tabItem" class="tab-btn ${activeTab === 'item' ? 'active' : ''}" onclick="switchTab('item')">📦 아이템 현황</button></div>
                <div class="tab-btn-wrap"><button id="tabHunt" class="tab-btn ${activeTab === 'hunt' ? 'active' : ''}" onclick="switchTab('hunt')">💰 사냥효율</button></div>
                <div class="tab-btn-wrap"><button id="tabMap" class="tab-btn ${activeTab === 'map' ? 'active' : ''}" onclick="switchTab('map')">🗺️ 맵 탭</button></div>
                <div class="tab-btn-wrap"><button id="tabHidden" class="tab-btn ${activeTab === 'hidden' ? 'active' : ''}" onclick="switchTab('hidden')">🕵️ 히든추리 탭</button></div>
            `;

            customTabs.forEach(t => {
                html += `
                    <div class="tab-btn-wrap ${isEdit ? 'editable-tabs' : ''}">
                        <button class="tab-btn ${activeTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.name}</button>
                        <button class="tab-del-btn" onclick="deleteCustomTab('${t.id}')" title="탭 삭제">✕</button>
                    </div>
                `;
            });

            tabBar.innerHTML = html;
        }

        function deleteCustomTab(tabId) {
            if (!isEdit) return;
            if (confirm("이 탭을 삭제하시겠습니까?")) {
                customTabs = customTabs.filter(t => t.id !== tabId);
                if (activeTab === tabId) activeTab = 'spec';
                renderTabBar();
                renderAll();
            }
        }

        function renderAll() {
            renderTabBar();
            const container = document.getElementById('boardContainer');
            const addBtn = document.getElementById('addBtn');
            const addColBtn = document.getElementById('addColBtn');

            if (activeTab === 'spec' || activeTab === 'item' || activeTab === 'hunt') {
                if (isEdit) {
                    addBtn.style.display = "inline-block";
                    addColBtn.style.display = "inline-block";
                    container.classList.add('editable');
                } else {
                    addBtn.style.display = "none";
                    addColBtn.style.display = "none";
                    container.classList.remove('editable');
                }

                container.innerHTML = `
                    <table id="mainTable">
                        <thead><tr id="headerRow"></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                `;
                renderHeader();
                renderBody();
            } else if (activeTab === 'map') {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderMapTab(container);
            } else if (activeTab === 'hidden') {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderHiddenTab(container);
            } else {
                addBtn.style.display = "none";
                addColBtn.style.display = "none";
                container.classList.remove('editable');
                renderCustomTab(container);
            }
        }

        function renderMapTab(container) {
            let cardsHtml = '';
            mapImages.forEach((item, idx) => {
                cardsHtml += `
                    <div class="img-card">
                        <input type="text" id="map_title_${idx}" value="${item.title}" ${!isEdit ? 'readonly' : ''} placeholder="맵/지역 이름">
                        <div class="img-card-preview" onclick="${item.img ? `openImageModal('${item.img}')` : (isEdit ? `triggerMapFile(${idx})` : '')}">
                            ${item.img ? `<img src="${item.img}" title="클릭하여 확대 보기">` : `<span>${isEdit ? '+ 스크린샷/사진 업로드' : '사진 없음'}</span>`}
                        </div>
                        <input type="file" id="map_file_${idx}" class="file-input" accept="image/*" onchange="uploadMapImg(event, ${idx})">
                        ${isEdit ? `<button class="btn btn-col" style="padding:6px; font-size:0.8rem; margin-top:2px;" onclick="triggerMapFile(${idx})">사진 변경/업로드</button>` : ''}
                        <textarea id="map_memo_${idx}" ${!isEdit ? 'readonly' : ''} placeholder="사냥터 정보, 주요 드랍 및 메모">${item.memo}</textarea>
                        ${isEdit ? `<button class="btn btn-del" style="padding:6px; font-size:0.85rem;" onclick="delMapCard(${idx})">카드 삭제</button>` : ''}
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="section-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h3 style="color:var(--text-gold);">🗺️ 사냥터 재화 정보 및 득템 명당 관리</h3>
                        ${isEdit ? `<button class="btn btn-add" style="padding:6px 12px; font-size:0.9rem;" onclick="addMapCard()">+ 맵 카드 추가</button>` : ''}
                    </div>
                    <div class="img-upload-grid">${cardsHtml}</div>
                </div>
            `;
        }

        function renderHiddenTab(container) {
            let html = '';
            hiddenJobsData.forEach((job, jobIndex) => {
                html += `
                    <div class="section-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <input type="text" id="hidden_name_${jobIndex}" value="${job.name}" 
                                style="background:transparent; border:none; color:var(--text-gold); font-size:1.25rem; font-weight:bold; outline:none; width: 250px;" 
                                ${!isEdit ? 'readonly' : ''}>
                            ${isEdit ? `<button class="btn btn-add" style="padding:6px 12px; font-size:0.9rem;" onclick="addHiddenItem(${jobIndex})">+ 단서 카드 추가</button>` : ''}
                        </div>
                        <div class="img-upload-grid">
                `;

                if (job.items) {
                    job.items.forEach((item, itemIndex) => {
                        html += `
                                <div class="img-card">
                                    <div class="img-card-preview" onclick="${item.img ? `openImageModal('${item.img}')` : (isEdit ? `triggerHiddenFile(${jobIndex}, ${itemIndex})` : '')}">
                                        ${item.img ? `<img src="${item.img}" title="클릭하여 확대 보기">` : `<span>${isEdit ? '+ 단서 사진 업로드' : '사진 없음'}</span>`}
                                    </div>
                                    <input type="file" id="hidden_file_${jobIndex}_${itemIndex}" class="file-input" accept="image/*" onchange="uploadHiddenImg(event, ${jobIndex}, ${itemIndex})">
                                    ${isEdit ? `<button class="btn btn-col" style="padding:6px; font-size:0.8rem; margin-top:2px;" onclick="triggerHiddenFile(${jobIndex}, ${itemIndex})">사진 변경/업로드</button>` : ''}
                                    <textarea id="hidden_memo_${jobIndex}_${itemIndex}" placeholder="전직 조건, 추리 내용, 단서 기록" ${!isEdit ? 'readonly' : ''}>${item.memo}</textarea>
                                    ${isEdit ? `<button class="btn btn-del" style="width:100%; padding:6px; margin-top:2px; font-size:0.9rem;" onclick="delHiddenItem(${jobIndex}, ${itemIndex})">단서 삭제</button>` : ''}
                                </div>
                        `;
                    });
                }

                html += `
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderCustomTab(container) {
            const found = customTabs.find(t => t.id === activeTab);
            const contentVal = found ? found.content : "";
            container.innerHTML = `
                <div class="section-box">
                    <h3 style="color:var(--text-gold); margin-bottom: 12px;">📌 ${found ? found.name : '사용자 탭'}</h3>
                    <textarea id="customTextArea" style="width:100%; height:450px; background:var(--box-bg); color:var(--text-light); border:1px solid var(--box-border); border-radius:6px; padding:15px; font-size:1.05rem; resize:vertical; outline:none;" ${!isEdit ? 'readonly' : ''}>${contentVal}</textarea>
                </div>
            `;
        }

        function triggerMapFile(idx) { document.getElementById(`map_file_${idx}`).click(); }
        function uploadMapImg(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                mapImages[idx].img = evt.target.result;
                renderAll();
            };
            reader.readAsDataURL(file);
        }
        function addMapCard() {
            syncInputsToData();
            mapImages.push({ id: "m_" + Date.now(), title: "새로운 사냥터", img: "", memo: "" });
            renderAll();
        }
        function delMapCard(idx) {
            syncInputsToData();
            mapImages.splice(idx, 1);
            renderAll();
        }

        function addHiddenItem(jobIndex) {
            if (!isEdit) return;
            syncInputsToData();
            if (!hiddenJobsData[jobIndex].items) hiddenJobsData[jobIndex].items = [];
            hiddenJobsData[jobIndex].items.push({ img: "", memo: "" });
            renderAll();
        }

        function delHiddenItem(jobIndex, itemIndex) {
            if (!isEdit) return;
            syncInputsToData();
            if (confirm("이 단서 카드를 삭제하시겠습니까?")) {
                hiddenJobsData[jobIndex].items.splice(itemIndex, 1);
                renderAll();
            }
        }

        function triggerHiddenFile(jobIndex, itemIndex) {
            if (!isEdit) return;
            syncInputsToData();
            const fileInput = document.getElementById(`hidden_file_${jobIndex}_${itemIndex}`);
            if (fileInput) fileInput.click();
        }

        function uploadHiddenImg(e, jobIndex, itemIndex) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                syncInputsToData();
                hiddenJobsData[jobIndex].items[itemIndex].img = evt.target.result;
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function toggleColumnLock(colId) {
            if (!isEdit) return;
            syncInputsToData();
            const cols = getCurrentColumns();
            const colObj = cols.find(c => c.id === colId);
            if (colObj) {
                colObj.locked = !colObj.locked;
                renderAll();
            }
        }

        function renderHeader() {
            const tr = document.getElementById('headerRow');
            if (!tr) return;
            tr.innerHTML = `<th style="width: 80px;"><div class="th-box">프로필</div></th>`;

            const cols = getCurrentColumns();
            cols.forEach((col, idx) => {
                const th = document.createElement('th');
                th.style.width = col.width || "100px";
                const isLocked = col.locked === true;
                
                th.innerHTML = `
                    <div class="th-box" style="${isLocked ? 'border-color: var(--warning);' : ''}">
                        <input type="text" data-colid="${col.id}" value="${col.title}" ${!isEdit || isLocked ? 'readonly' : ''}>
                        <div style="font-size:0.7rem; color:${isLocked ? 'var(--warning)' : '#94a3b8'}; cursor:pointer; margin-top:2px;" onclick="toggleColumnLock('${col.id}')">
                            ${isLocked ? '🔒 항목 잠금' : '🔓 잠금해제'}
                        </div>
                        ${isEdit ? `
                        <div class="col-btn-group">
                            <button class="col-btn-mv" onclick="moveColumn(${idx}, -1)">◀</button>
                            <button class="col-btn-mv" onclick="moveColumn(${idx}, 1)">▶</button>
                            <button class="btn-col-del" onclick="delColumn('${col.id}')">✕</button>
                        </div>` : ''}
                    </div>
                `;
                tr.appendChild(th);
            });

            if (isEdit) {
                tr.innerHTML += `<th style="width: 110px;"><div class="th-box" style="color:var(--text-gold);">관리</div></th>`;
            }
        }

        function renderBody() {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            const cols = getCurrentColumns();

            membersData.forEach((m, idx) => {
                const tr = document.createElement('tr');
                
                const sId = soopIdMap[m.c1];
                let profileCellHtml = `
                    <td>
                        <div class="td-box">
                            <div class="profile-wrap" onclick="triggerFile(${idx})" title="클릭하여 프로필 사진 업로드">
                                ${m.img ? `<img src="${m.img}" title="프로필 사진">` : `<span>사진 업로드</span>`}
                            </div>
                            <div style="font-size: 0.75rem; margin-top: 2px;">
                                ${sId ? `<a href="https://ch.sooplive.co.kr/${sId}" target="_blank" style="color: #38bdf8; text-decoration: none; font-weight: bold;">방송국 바로가기</a>` : (isEdit ? `<span style="color: #94a3b8; cursor: pointer;" onclick="triggerFile(${idx})">업로드</span>` : `<span style="color: #64748b;">정보없음</span>`)}
                            </div>
                            <input type="file" id="f-${idx}" class="file-input" accept="image/*" onchange="uploadImg(event, ${idx})">
                        </div>
                    </td>
                `;

                let html = profileCellHtml;

                cols.forEach(col => {
                    const val = m[col.id] || "0";
                    const isName = (col.id === 'c1');
                    const isJob = (col.id === 'c2');
                    const isWeaponEnchant = (activeTab === 'spec' && col.title === '무기강화');
                    const isLocked = col.locked === true;
                    const disabledAttr = (!isEdit || isLocked) ? 'disabled' : '';
                    const readonlyAttr = (!isEdit || isLocked) ? 'readonly' : '';

                    let lockBadgeHtml = isLocked ? `<div class="lock-indicator">🔒 잠김</div>` : '';

                    if (isJob) {
                        let optionsHtml = '';
                        let hasMatched = false;
                        JOB_LIST.forEach(j => {
                            const selected = (val === j) ? 'selected' : '';
                            if (selected) hasMatched = true;
                            optionsHtml += `<option value="${j}" ${selected}>${j}</option>`;
                        });
                        if (!hasMatched && val) {
                            optionsHtml = `<option value="${val}" selected>${val}</option>` + optionsHtml;
                        }

                        html += `
                            <td>
                                <div class="td-box job-tag ${getJobClass(val)} ${isLocked ? 'column-locked' : ''}">
                                    ${lockBadgeHtml}
                                    <select class="job-select" data-colid="${col.id}" ${disabledAttr} onchange="handleJobChange(this)">
                                        ${optionsHtml}
                                    </select>
                                </div>
                            </td>
                        `;
                    } else if (isWeaponEnchant) {
                        let optionsHtml = '';
                        let hasMatched = false;
                        ENCHANT_LIST.forEach(e => {
                            const selected = (val === e) ? 'selected' : '';
                            if (selected) hasMatched = true;
                            optionsHtml += `<option value="${e}" ${selected}>+${e}강</option>`;
                        });
                        if (!hasMatched && val) {
                            optionsHtml = `<option value="${val}" selected>+${val}강</option>` + optionsHtml;
                        }

                        html += `
                            <td>
                                <div class="td-box ${getEnchantClass(val)} ${isLocked ? 'column-locked' : ''}">
                                    ${lockBadgeHtml}
                                    <select class="enchant-select" data-colid="${col.id}" ${disabledAttr} onchange="handleEnchantChange(this)">
                                        ${optionsHtml}
                                    </select>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td>
                                <div class="td-box ${isLocked ? 'column-locked' : ''}">
                                    ${lockBadgeHtml}
                                    <input type="text" data-colid="${col.id}" value="${val}" ${readonlyAttr} style="${isName ? 'font-weight:bold;' : ''}">
                                </div>
                            </td>
                        `;
                    }
                });

                if (isEdit) {
                    html += `
                        <td>
                            <div class="td-box" style="padding:2px; border:none; background:transparent;">
                                <div class="btn-action-group">
                                    <button class="btn-move" onclick="moveRow(${idx}, -1)">▲</button>
                                    <button class="btn-move" onclick="moveRow(${idx}, 1)">▼</button>
                                    <button class="btn-del" onclick="delRow(${idx})">삭제</button>
                                </div>
                            </div>
                        </td>
                    `;
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function triggerFile(idx) { 
            if (!isEdit) {
                alert("수정 모드에서만 사진을 업로드할 수 있습니다. 상단의 '수정 권한 얻기' 버튼을 눌러주세요.");
                return;
            }
            document.getElementById(`f-${idx}`).click(); 
        }

        function uploadImg(e, idx) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                membersData[idx].img = evt.target.result;
                renderBody();
            };
            reader.readAsDataURL(file);
        }

        function addRow() {
            if (!isEdit) return;
            syncInputsToData();
            let newObj = { img: "", c1: "새팀원", c2: "미정", c3: "0", c4: "0", c5: "0", c6: "0", c7: "0", c8: "0", c9: "", i1: "0", i2: "0", i3: "0", i4: "0", i5: "-", i6: "-", i7: "", h_spot: "미정", h_gold: "0", h_drop: "-", h_memo: "" };
            membersData.push(newObj);
            renderBody();
        }

        function delRow(idx) {
            if (!isEdit) return;
            if (confirm("해당 팀원을 삭제하시겠습니까?")) {
                syncInputsToData();
                membersData.splice(idx, 1);
                renderBody();
            }
        }

        function addColumn() {
            if (!isEdit || activeTab === 'map' || activeTab === 'hidden' || customTabs.some(t => t.id === activeTab)) return;
            syncInputsToData();
            const title = prompt("새로 추가할 항목(열)의 이름을 입력하세요:", "새 항목");
            if (!title) return;

            const cols = getCurrentColumns();
            const prefix = activeTab === 'spec' ? 'c_' : (activeTab === 'item' ? 'i_' : 'h_');
            const newId = prefix + Date.now();
            cols.push({ id: newId, title: title.trim(), width: "130px", locked: false });

            membersData.forEach(m => {
                if (m[newId] === undefined) m[newId] = "0";
            });

            renderAll();
        }

        function delColumn(colId) {
            if (!isEdit) return;
            if (confirm("이 항목(열) 전체를 삭제하시겠습니까?")) {
                syncInputsToData();
                if (activeTab === 'spec') {
                    specColumns = specColumns.filter(c => c.id !== colId);
                } else if (activeTab === 'item') {
                    itemColumns = itemColumns.filter(c => c.id !== colId);
                } else if (activeTab === 'hunt') {
                    huntColumns = huntColumns.filter(c => c.id !== colId);
                }
                renderAll();
            }
        }

        function moveColumn(colIdx, dir) {
            if (!isEdit) return;
            syncInputsToData();
            const cols = getCurrentColumns();
            const targetIdx = colIdx + dir;
            if (targetIdx < 0 || targetIdx >= cols.length) return;
            const temp = cols[colIdx];
            cols[colIdx] = cols[targetIdx];
            cols[targetIdx] = temp;
            renderAll();
        }

        function moveRow(idx, dir) {
            if (!isEdit) return;
            syncInputsToData();
            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= membersData.length) return;
            const temp = membersData[idx];
            membersData[idx] = membersData[targetIdx];
            membersData[targetIdx] = temp;
            renderBody();
        }

        function getJobClass(jobText) {
            if (!jobText) return 'job-default';
            const val = jobText.trim();
            if (val.includes('나이트')) return 'job-knight';
            if (val.includes('위자드')) return 'job-wizard';
            if (val.includes('워리어')) return 'job-warrior';
            if (val.includes('어쌔신')) return 'job-assassin';
            if (val.includes('헌터')) return 'job-hunter';
            return 'job-default';
        }

        function getEnchantClass(val) {
            const num = parseInt(val);
            if (isNaN(num)) return 'enchant-default';
            if (num <= 6) return 'enchant-safe';     
            if (num === 7) return 'enchant-7';     
            if (num === 8) return 'enchant-8';     
            if (num === 9) return 'enchant-9';     
            if (num === 10) return 'enchant-10';   
            if (num === 11) return 'enchant-11';   
            if (num >= 12) return 'enchant-12';    
            return 'enchant-default';
        }

        function handleEnchantChange(selectElem) {
            const tdBox = selectElem.closest('.td-box');
            if (tdBox) {
                const val = selectElem.value;
                tdBox.className = 'td-box ' + getEnchantClass(val);
            }
        }

        function handleJobChange(selectElem) {
            const tdBox = selectElem.closest('.td-box');
            if (tdBox) {
                tdBox.className = 'td-box job-tag ' + getJobClass(selectElem.value);
            }
        }

        function saveData() {
            syncInputsToData();
            const dataToSave = {
                specColumns: specColumns,
                itemColumns: itemColumns,
                huntColumns: huntColumns,
                membersData: membersData,
                mapImages: mapImages,
                hiddenJobsData: hiddenJobsData,
                customTabs: customTabs
            };

            const dbRefInstance = window.dbRef(window.db, 'kimteam_board');
            window.dbSet(dbRefInstance, dataToSave)
                .then(() => {
                    alert("성공적으로 저장(실시간 동기화)되었습니다!");
                })
                .catch((error) => {
                    alert("저장 실패: " + error.message);
                });
        }
    </script>
</body>
</html>
