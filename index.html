<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아르케온 기숙사 - 마법해금 연구소</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181c24;
      --accent-color: #8a2be2;
      --accent-hover: #9c3eee;
      --text-color: #e2e8f0;
      --border-color: #2d3748;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .header h1 {
      color: var(--accent-color);
      margin: 0 0 5px 0;
      font-size: 26px;
    }

    .user-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 0.85em;
      flex-wrap: wrap;
    }

    .tab-menu {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filter-search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .element-sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 5px;
      flex: 1;
    }

    .element-sub-btn {
      background-color: #181818;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .element-sub-btn.active {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .search-input-box {
      min-width: 240px;
      flex: 0.5;
    }

    .search-input-box input {
      margin-bottom: 0;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #0f1115;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
    }

    button:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #4a5568; color: #fff; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .magic-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
    }
    .magic-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    /* 🖼️ 이미지 가독성 및 여백 최소화 최적화 */
    .magic-img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      margin: 10px 0;
      background-color: rgba(0,0,0,0.2);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .magic-img:hover { opacity: 0.85; }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      width: fit-content;
    }
    .badge-바람 { background-color: #319795; color: #fff; }
    .badge-화염 { background-color: #dd6b20; color: #fff; }
    .badge-물 { background-color: #3182ce; color: #fff; }
    .badge-대지 { background-color: #276749; color: #fff; }
    .badge-빛 { background-color: #d69e2e; color: #000; }
    .badge-어둠 { background-color: #4a5568; color: #fff; }

    .info-box {
      background-color: rgba(15, 17, 21, 0.6);
      border-radius: 6px;
      padding: 10px;
      margin-top: auto;
      font-size: 13px;
    }

    .info-row {
      margin-bottom: 4px;
      color: #cbd5e0;
      display: flex;
      justify-content: space-between;
    }
    .info-row span {
      color: #fff;
      font-weight: bold;
      text-align: right;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 25px;
      margin-bottom: 15px;
    }
    .page-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .page-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    #imageModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: pointer;
    }

    #expandedImg {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 8px;
    }

    .card-action-btns {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
    }

    .card-action-btns button {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-color);
      color: #cbd5e0;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .card-action-btns button:hover { background-color: var(--accent-color); color: #fff; }
  </style>

  <!-- Firebase SDK 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCL-9nkL26H-ZQufDznXERNlf_eDeHmwjs",
      authDomain: "sanhaegung-dea90.firebaseapp.com",
      projectId: "sanhaegung-dea90",
      storageBucket: "sanhaegung-dea90.firebasestorage.app",
      messagingSenderId: "876388941028",
      appId: "1:876388941028:web:51b83acd86fb1ef709c0f1",
      measurementId: "G-9B699532TC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.onSnapshot = onSnapshot;
    window.addDoc = addDoc;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.updateDoc = updateDoc;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>✨ 아르케온 기숙사 마법해금 연구소</h1>
      <p style="font-size: 0.9em; margin: 5px 0 0 0; color: #a0aec0;">SOOP 마인크래프트 서버 '차카데미' 아르케온 기숙사 전용 공유소</p>
    </div>

    <div class="user-bar">
      <span id="userInfoDisplay" style="align-self: center; margin-right: auto; color: #a0aec0;">전체 시청자 모드 (조회 전용)</span>
      <button onclick="tryOpenRegisterForm()">+ 해금 정보 등록 (스트리머 전용)</button>
    </div>

    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab('magic')">🔮 마법해금 조건 공유</button>
      <button class="tab-btn" onclick="switchTab('notice')">📢 공지사항</button>
    </div>

    <!-- 1. 마법해금 조건 공유 탭 -->
    <div id="tab-magic" class="tab-content active">
      <div class="action-bar">
        <h3>아르케온 마법 해금 리스트</h3>
      </div>

      <!-- 속성별 서브 탭 & 실시간 검색 바 -->
      <div class="filter-search-bar">
        <div class="element-sub-tabs">
          <button class="element-sub-btn active" onclick="setElementFilter('all', this)">🌪️ 전체</button>
          <button class="element-sub-btn" onclick="setElementFilter('바람', this)">💨 바람</button>
          <button class="element-sub-btn" onclick="setElementFilter('화염', this)">🔥 화염</button>
          <button class="element-sub-btn" onclick="setElementFilter('물', this)">💧 물</button>
          <button class="element-sub-btn" onclick="setElementFilter('대지', this)">🌍 대지</button>
          <button class="element-sub-btn" onclick="setElementFilter('빛', this)">✨ 빛</button>
          <button class="element-sub-btn" onclick="setElementFilter('어둠', this)">🌑 어둠</button>
        </div>
        <div class="search-input-box">
          <input type="text" id="magicSearchInput" placeholder="🔍 마법 이름, 스트리머, 재료 검색..." oninput="currentPage=1; renderMagics()">
        </div>
      </div>

      <!-- 등록/수정 폼 -->
      <div id="form-magic-card" class="card" style="display:none;">
        <h4 id="magicFormTitle" style="color:var(--accent-color); margin-top:0;">새 마법해금 정보 등록</h4>
        <input type="hidden" id="editMagicId" value="">
        <input type="text" id="magTitle" placeholder="마법 이름 (예: 파이어볼 2단계)">
        <input type="text" id="magAuthor" placeholder="스트리머 닉네임">
        <select id="magElement">
          <option value="바람">💨 바람 속성</option>
          <option value="화염">🔥 화염 속성</option>
          <option value="물">💧 물 속성</option>
          <option value="대지">🌍 대지 속성</option>
          <option value="빛">✨ 빛 속성</option>
          <option value="어둠">🌑 어둠 속성</option>
        </select>
        <input type="text" id="magMaterials" placeholder="필요 재료 (예: 마력 결정 5개)">
        <input type="text" id="magLocation" placeholder="해금 조건 (예: 네더 요새에서 몬스터 50마리 처치)">
        <textarea id="magDesc" rows="3" placeholder="상세 공략 및 주의사항 (선택사항)"></textarea>
        
        <label style="font-size: 0.85em; color: #a0aec0; display:block; margin-top:5px;">📷 사진 직접 업로드 (파일 선택):</label>
        <input type="file" id="magFile" accept="image/*">
        
        <label style="font-size: 0.85em; color: #a0aec0; display:block; margin-top:5px;">🔗 또는 이미지 주소(링크) 입력:</label>
        <input type="text" id="magImageUrl" placeholder="https://example.com/image.png (디스코드 이미지 주소 등)">

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="saveMagic()">저장하기</button>
          <button class="btn-secondary" onclick="closeMagicForm()">취소</button>
        </div>
      </div>

      <!-- 마법 카드 목록 영역 -->
      <div id="magicGrid" class="grid-container"></div>
      
      <!-- 페이지네이션 버튼 영역 -->
      <div id="paginationContainer" class="pagination"></div>
    </div>

    <!-- 2. 공지사항 탭 -->
    <div id="tab-notice" class="tab-content">
      <div class="action-bar">
        <h3>기숙사 공지사항</h3>
      </div>
      <div id="noticeList"></div>
    </div>
  </div>

  <!-- 이미지 확대 모달 -->
  <div id="imageModal" onclick="closeImageModal()">
    <img id="expandedImg" src="">
  </div>

  <!-- 최초 1회 비밀번호 입력 모달 -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:var(--accent-color);">스트리머 권한 인증</h3>
      <p style="font-size:0.85em; color:#a0aec0;">마법 해금 정보를 등록/수정/삭제하려면 스트리머 비밀번호를 입력하세요. (한 번 입력하면 세션 동안 유지됩니다)</p>
      <input type="password" id="checkSecretPw" placeholder="비밀번호 입력">
      <button onclick="verifyPassword()" style="width:100%; margin-top:5px;">인증하기</button>
      <button class="btn-secondary" onclick="closeModals()" style="width:100%; margin-top:5px;">닫기</button>
    </div>
  </div>

  <script>
    const STREAMER_PASSWORD = "rinring"; 

    let store = {
      magics: [],
      notices: []
    };

    let currentElementFilter = 'all';
    let currentPage = 1;
    const itemsPerPage = 12; 
    let pendingAction = null;

    window.addEventListener('firebase-ready', () => {
      checkAuthStatus();
      initRealtimeSync();
    });

    // 🔄 진정한 파이어베이스 실시간 동기화 (100% 렉 없음)
    function initRealtimeSync() {
      try {
        window.onSnapshot(window.collection(window.db, "archeon_magics"), (snapshot) => {
          store.magics = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => (b.id || 0) - (a.id || 0));
          renderMagics();
        }, (error) => {
          console.error("실시간 동기화 오류:", error);
        });

        window.onSnapshot(window.collection(window.db, "archeon_notices"), (snapshot) => {
          store.notices = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() })).sort((a,b) => (b.id || 0) - (a.id || 0));
          renderNotices();
        });
      } catch (e) {
        console.error("데이터 수신 오류:", e);
      }
    }

    function checkAuthStatus() {
      const isAuthed = sessionStorage.getItem('archeon_authed') === 'true';
      const display = document.getElementById('userInfoDisplay');
      if (isAuthed) {
        display.innerText = "✨ 스트리머 인증 완료 (편집 가능)";
        display.style.color = "var(--accent-color)";
      } else {
        display.innerText = "전체 시청자 모드 (조회 전용)";
        display.style.color = "#a0aec0";
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      if(event && event.currentTarget) event.currentTarget.classList.add('active');
    }

    function setElementFilter(element, btnEl) {
      currentElementFilter = element;
      currentPage = 1; 
      document.querySelectorAll('.element-sub-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      renderMagics();
    }

    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function openImageModal(imgSrc, event) {
      if(event) event.stopPropagation();
      document.getElementById('expandedImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() { document.getElementById('imageModal').style.display = 'none'; }

    function requireAuth(actionCallback) {
      const isAuthed = sessionStorage.getItem('archeon_authed') === 'true';
      if (isAuthed) {
        actionCallback();
      } else {
        pendingAction = actionCallback;
        document.getElementById('checkSecretPw').value = '';
        document.getElementById('authModal').style.display = 'flex';
      }
    }

    function verifyPassword() {
      const pwInput = document.getElementById('checkSecretPw').value.trim();
      if (pwInput === STREAMER_PASSWORD) {
        sessionStorage.setItem('archeon_authed', 'true');
        closeModals();
        checkAuthStatus();
        alert("인증되었습니다! 이제 자유롭게 등록/수정/삭제가 가능합니다.");
        if (pendingAction) {
          pendingAction();
          pendingAction = null;
        }
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    }

    function tryOpenRegisterForm() {
      requireAuth(() => { openMagicForm(); });
    }

    function tryAction(callback) {
      requireAuth(callback);
    }

    function openMagicForm(editId = null) {
      document.getElementById('form-magic-card').style.display = 'block';
      if(editId) {
        document.getElementById('magicFormTitle').innerText = "마법해금 정보 수정";
        document.getElementById('editMagicId').value = editId;
        const target = store.magics.find(m => m.firestoreId === editId);
        if(target) {
          document.getElementById('magTitle').value = target.title || '';
          document.getElementById('magAuthor').value = target.author || '';
          document.getElementById('magElement').value = target.element || '바람';
          document.getElementById('magMaterials').value = target.materials || '';
          document.getElementById('magLocation').value = target.location || '';
          document.getElementById('magDesc').value = target.description || '';
          document.getElementById('magImageUrl').value = (target.image && target.image.startsWith('http')) ? target.image : '';
        }
      } else {
        document.getElementById('magicFormTitle').innerText = "새 마법해금 정보 등록";
        document.getElementById('editMagicId').value = '';
        document.getElementById('magTitle').value = '';
        document.getElementById('magAuthor').value = '';
        document.getElementById('magElement').value = '바람';
        document.getElementById('magMaterials').value = '';
        document.getElementById('magLocation').value = '';
        document.getElementById('magDesc').value = '';
        document.getElementById('magFile').value = '';
        document.getElementById('magImageUrl').value = '';
      }
    }

    function closeMagicForm() { document.getElementById('form-magic-card').style.display = 'none'; }

    async function saveMagic() {
      const title = document.getElementById('magTitle').value.trim();
      const author = document.getElementById('magAuthor').value.trim();
      const element = document.getElementById('magElement').value;
      const materials = document.getElementById('magMaterials').value.trim();
      const location = document.getElementById('magLocation').value.trim();
      const description = document.getElementById('magDesc').value.trim();
      const fileInput = document.getElementById('magFile');
      const imageUrlInput = document.getElementById('magImageUrl').value.trim();
      const editId = document.getElementById('editMagicId').value;

      if(!title || !author) { alert("마법 이름과 스트리머 닉네임은 필수입니다."); return; }

      let imageUrl = "";
      if(editId) {
        const existing = store.magics.find(m => m.firestoreId === editId);
        if(existing) imageUrl = existing.image || "";
      }

      if(imageUrlInput) {
        imageUrl = imageUrlInput;
      }
      else if(fileInput.files && fileInput.files[0]) {
        imageUrl = await compressImage(fileInput.files[0]);
      }

      if(editId) {
        await window.updateDoc(window.doc(window.db, "archeon_mag
